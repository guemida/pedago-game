      id: 1,
      title: "DIAGNOSTIC RÉSEAU",
      topic: "Ping & Connectivité",
      mission: "Un serveur ne répond plus. Utilisez 'ping' pour diagnostiquer, puis 'traceroute' pour localiser le problème.",
      hint: "Essayez: ping 192.168.1.10, puis ping 8.8.8.8, puis traceroute 8.8.8.8",
      commands: {
        help: {
          response: [
            "╔═══════════════════════════════════════════════╗",
            "║  ping <ip>       - Tester la connectivité     ║",
            "║  traceroute <ip> - Tracer le chemin réseau     ║",
            "║  diagnose        - Analyser le problème       ║",
            "║  explain         - Comprendre ping/traceroute ║",
            "╚═══════════════════════════════════════════════╝",
          ],
        },
        explain: {

            "📖 PING & TRACEROUTE",
            "━━━━━━━━━━━━━━━━━━━━",
            "PING envoie un paquet ICMP Echo Request :",
            "  → Si réponse : la machine est joignable",
            "  → Si timeout : problème réseau ou machine down",

          response: [
            "PING 192.168.1.1 :",
            "  64 bytes from 192.168.1.1: ttl=64 time=1.2ms",
            "  ✓ Gateway OK",
          ],
        },
        "ping 8.8.8.8": {
          response: [
            "PING 8.8.8.8 :",
            "  Request timeout for icmp_seq 0",
            "  Request timeout for icmp_seq 1",
            "  Request timeout for icmp_seq 2",
            "  ✗ 100% packet loss — Pas d'accès Internet !",
            "",
            "→ Le LAN fonctionne mais pas Internet. Lancez traceroute 8.8.8.8",
          ],
        },
        "traceroute 8.8.8.8": {
          response: [
            "traceroute to 8.8.8.8 :",
            "  1  192.168.1.1    1.2ms   ✓ (votre gateway)",
            "  2  10.0.0.1       3.5ms   ✓ (routeur FAI)",
            "  3  82.64.12.1     8.1ms   ✓ (backbone FAI)",
            "  4  * * *          ✗ TIMEOUT",
            "  5  * * *          ✗ TIMEOUT",
            "",
            "⚠ Le paquet se perd au hop 4 — problème chez le FAI !",
            "→ Tapez 'diagnose' pour conclure.",
          ],
        },
        diagnose: {
          response: [
            "╔═══════════════════════════════════════════════╗",
            "║  DIAGNOSTIC RÉSEAU                            ║",
            "╠═══════════════════════════════════════════════╣",
            "║  ✓ LAN         : Fonctionnel                 ║",
            "║  ✓ Gateway     : Joignable                   ║",
            "║  ✓ FAI hop 1-3 : OK                          ║",
            "║  ✗ FAI hop 4+  : PERTE DE PAQUETS            ║",
            "╠═══════════════════════════════════════════════╣",
            "║  Conclusion: Panne chez le FAI, pas locale.  ║",
            "║  Action: Contacter le support FAI.            ║",
            "╚═══════════════════════════════════════════════╝",
            "",
            "✓ Diagnostic correct ! Niveau suivant débloqué.",
          ],
          nextLevel: true,
        },
      },
      defaultResponse: (input) => {
        if (input === "traceroute" || input === "ping") {
          return ["✗ Usage : " + input + " <adresse_ip>", "  Exemple : " + input + " 8.8.8.8"];
        }
        if (input.startsWith("traceroute ")) {
          const ip = input.slice(11).trim();
          if (ip === "192.168.1.1") {
            return ["traceroute to 192.168.1.1 :", "  1  192.168.1.1    1.1ms   ✓ (votre gateway)", "", "→ Le routeur local est joignable. Essayez traceroute 8.8.8.8"];
          }
          if (ip === "192.168.1.10") {
            return ["traceroute to 192.168.1.10 :", "  1  192.168.1.10   0.8ms   ✓ (réseau local)", "", "→ Le serveur local est joignable. Le problème est plus loin. Essayez traceroute 8.8.8.8"];
          }
          return ["traceroute to " + ip + " :", "  1  192.168.1.1    1.2ms   ✓ (votre gateway)", "  2  * * *          ✗ TIMEOUT", "", "→ Pas de route vers " + ip + ". Essayez traceroute 8.8.8.8"];
        }
        if (input.startsWith("ping ")) {
          const ip = input.slice(5).trim();
          return ["PING " + ip + " :", "  Request timeout for icmp_seq 0", "  ✗ Hôte injoignable."];

        return null;

    // ─── LEVEL 2: SUBNETTING ───
    {
      id: 2,
      title: "CALCUL DE SOUS-RÉSEAU",
      topic: "Subnetting",
      mission: `Réseau: ${subnet.network}${subnet.cidr}. Calculez le nombre d'hôtes possibles. Tapez 'answer <nombre>'.`,
      hint: `Masque ${subnet.mask} = ${subnet.cidr}. Formule : 2^(32-prefix) - 2. La réponse est ${subnet.hosts}.`,
      commands: {
        help: {
          response: [
            "╔═══════════════════════════════════════════════╗",
            "║  subnet info     - Voir les infos réseau      ║",
            "║  answer <nombre> - Donner votre réponse       ║",
            "║  explain         - Comprendre le subnetting   ║",
            "║  calc <cidr>     - Aide au calcul             ║",
            "╚═══════════════════════════════════════════════╝",
          ],
        },
        explain: {
          response: [
            "📖 SUBNETTING (SOUS-RÉSEAU)",
            "━━━━━━━━━━━━━━━━━━━━━━━━━━━",
            "Une adresse IPv4 = 32 bits : RÉSEAU | HÔTE",
            "",
            "Le masque définit la frontière :",
            "  /24 = 255.255.255.0   → 8 bits hôte  → 2⁸-2 = 254 hôtes",
            "  /25 = 255.255.255.128 → 7 bits hôte  → 2⁷-2 = 126 hôtes",
            "  /16 = 255.255.0.0     → 16 bits hôte → 2¹⁶-2 = 65534 hôtes",
            "",
            "On retire 2 : adresse réseau + broadcast",
            "",
            "Notation CIDR: /24 = les 24 premiers bits sont le réseau",
            "Bits hôte = 32 - préfixe CIDR",
            "Hôtes = 2^(bits hôte) - 2",
          ],
        },
        "subnet info": {
          response: [
            `  Réseau    : ${subnet.network}`,
            `  Masque    : ${subnet.mask}`,
            `  CIDR      : ${subnet.cidr}`,
            `  Broadcast : ${subnet.broadcast}`,
            "",
            "→ Combien d'hôtes utilisables ? Tapez 'answer <nombre>'",
          ],
        },
      },
      defaultResponse: (input) => {
        const m = input.match(/^calc \/(\d+)$/);
        if (m) {
          const p = parseInt(m[1]);
          if (p < 0 || p > 32) return ["✗ CIDR doit être entre 0 et 32."];
          const bits = 32 - p;
          const hosts = Math.pow(2, bits) - 2;
          return [
            `  /${p} → ${bits} bits hôte`,
            `  2^${bits} - 2 = ${hosts} hôtes utilisables`,
          ];
        }
        const a = input.match(/^answer (\d+)$/);
        if (a) {
          if (a[1] === subnet.hosts) return null; // win handled by checkWin
          return [`✗ Incorrect. Indice : masque ${subnet.mask}, formule 2^(bits hôte) - 2`];
        }
        return null;
      },
      checkWin: (input) => {
        const m = input.match(/^answer (\d+)$/);
        return m && m[1] === subnet.hosts;
      },
      winResponse: [
        `✓ CORRECT ! ${subnet.hosts} hôtes utilisables sur un ${subnet.cidr}`,
        "",
        "Le subnetting est la BASE de l'architecture réseau.",
        "→ Niveau suivant débloqué !",

            "  1. Cache local (navigateur, OS)",
            "  2. Serveur DNS récursif (FAI ou 8.8.8.8)",
            "  3. Serveur racine → .fr → domaine",
            "  4. Serveur autoritaire du domaine",
            "",
            "Types d'enregistrements :",
            "  A     : domaine → IPv4",
            "  AAAA  : domaine → IPv6",
            "  CNAME : alias → autre domaine",
            "  MX    : serveur mail",
            "  NS    : serveur DNS autoritaire",
            "  TXT   : données texte (SPF, DKIM...)",
          ],
        },
      },
      defaultResponse: (input) => {
        if (input === `nslookup ${dns.domain}`) {
          return [
            `Server:    8.8.8.8`,
            `Address:   8.8.8.8#53`,
            "",
            `Non-authoritative answer:`,
            `Name:    ${dns.domain}`,
            `Address: ${dns.ip}`,
            "",
            `→ Tapez 'answer ${dns.ip}' pour valider.`,
          ];
        }
        if (input === `dig ${dns.domain}`) {
          return [
            `;; ANSWER SECTION:`,
            `${dns.domain}.  300  IN  ${dns.type}  ${dns.ip}`,
            "",
            `;; Query time: 12 msec`,
            `;; SERVER: 8.8.8.8#53`,
            `;; MSG SIZE rcvd: 58`,
            "",
            `→ Record ${dns.type} trouvé ! Tapez 'answer ${dns.ip}'`,
          ];
        }
        if (input.startsWith("nslookup ") || input.startsWith("dig ")) {
          return ["✗ Domaine inconnu. Vérifiez le nom exact dans la mission."];
        }
        const a = input.match(/^answer (.+)$/);
        if (a) {
          if (a[1] === dns.ip) return null;
          return [`✗ Ce n'est pas la bonne IP. Utilisez nslookup ou dig sur ${dns.domain}`];
        }
        return null;
      },
      checkWin: (input) => {
        const m = input.match(/^answer (.+)$/);
        return m && m[1] === dns.ip;
      },
      winResponse: [
        `✓ CORRECT ! ${dns.domain} → ${dns.ip}`,
        "",
        "Le DNS est le \"annuaire\" d'Internet.",
        "Sans DNS, il faudrait retenir toutes les IP par cœur !",
        "→ Niveau suivant débloqué !",

    },

        dora: {
          response: [
            "⟳ Processus DHCP DORA en cours...",

          ],

        verify: {
          response: [
            "╔═══════════════════════════════════════════════╗",
            "║  VÉRIFICATION CONFIG RÉSEAU - Nouveau PC      ║",
            "╠═══════════════════════════════════════════════╣",
            "║  IP       : 192.168.1.104        ✓           ║",
            "║  Masque   : 255.255.255.0        ✓           ║",
            "║  Gateway  : 192.168.1.1          ✓           ║",

// ─── Main Component ───
function NetworkGame() {
  const [levels, setLevels] = useState(() => generateLevels());
  const [level, setLevel] = useState(0);
  const [lines, setLines] = useState([]);
  const [input, setInput] = useState("");
  const [showIntro, setShowIntro] = useState(true);
  const [hintsUsed, setHintsUsed] = useState(0);
  const [commandHistory, setCommandHistory] = useState([]);
  const [historyIndex, setHistoryIndex] = useState(-1);
  const [startTime] = useState(Date.now());
  const [score, setScore] = useState(0);

  const inputRef = useRef(null);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [lines]);

  const focusInput = useCallback(() => {
    if (inputRef.current) inputRef.current.focus();
  }, []);

  useEffect(() => {
    focusInput();
  }, [showIntro, focusInput]);

  const addLines = useCallback((newLines) => {
    setLines((prev) => [...prev, ...newLines]);
  }, []);

  const processCommand = useCallback(
    (cmd) => {
      const trimmed = cmd.trim().toLowerCase();
      if (!trimmed) return;

      setCommandHistory((prev) => [...prev, trimmed]);
      setHistoryIndex(-1);
      addLines([``, `┌─ root@netops:~$`, `└─▸ ${cmd.trim()}`]);

      const currentLevel = levels[level];

      // Global commands
      if (trimmed === "clear") {
        setLines([]);
        return;
      }
      if (trimmed === "mission") {
        addLines(["", `📋 MISSION : ${currentLevel.mission}`]);
        return;
      }
      if (trimmed === "hint") {
        setHintsUsed((h) => h + 1);
        addLines(["", `💡 INDICE : ${currentLevel.hint}`]);
        return;
      }
      if (trimmed === "score") {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        addLines([
          "",
          `📊 Score: ${score} pts | Niveau: ${level}/${levels.length - 2} | Hints: ${hintsUsed} | Temps: ${Math.floor(elapsed / 60)}m${elapsed % 60}s`,
        ]);
        return;
      }
      if (trimmed === "restart" && currentLevel.victory) {
        const newLevels = generateLevels();
        setLevels(newLevels);
        setLevel(0);
        setLines([]);
        setHintsUsed(0);
        setScore(0);
        setShowIntro(true);
        return;
      }

      // Check custom checkWin
      if (currentLevel.checkWin && currentLevel.checkWin(trimmed)) {
        addLines(["", ...currentLevel.winResponse]);
        setScore((s) => s + 150);
        setTimeout(() => {
          setLevel((l) => l + 1);
          addLines(["", "━".repeat(50), ""]);
          const next = levels[level + 1];
          if (next && !next.victory) {
            addLines([
              `⬡ NIVEAU ${level + 1} — ${next.title}`,
              `  Sujet : ${next.topic}`,
              `  ${next.mission}`,
              "",
              "  Tapez 'help' pour les commandes disponibles.",
            ]);
          } else if (next && next.victory) {
            addLines(VICTORY_ASCII);
          }
        }, 500);
        return;
      }

      // Check defaultResponse
      if (currentLevel.defaultResponse) {
        const resp = currentLevel.defaultResponse(trimmed);
        if (resp) {
          addLines(["", ...resp]);
          return;
        }
      }

      // Check static commands
      if (currentLevel.commands[trimmed]) {
        const cmdDef = currentLevel.commands[trimmed];
        addLines(["", ...cmdDef.response]);
        if (cmdDef.nextLevel) {
          setScore((s) => s + 100);
          setTimeout(() => {
            setLevel((l) => l + 1);
            addLines(["", "━".repeat(50), ""]);
            const next = levels[level + 1];
            if (next && !next.victory) {
              addLines([
                `⬡ NIVEAU ${level + 1} — ${next.title}`,
                `  Sujet : ${next.topic}`,
                `  ${next.mission}`,
                "",
                "  Tapez 'help' pour les commandes disponibles.",
              ]);
            } else if (next && next.victory) {
              addLines(VICTORY_ASCII);
            }
          }, 500);
        }
        return;
      }

      // Unknown command
      addLines([
        "",
        `✗ Commande inconnue : '${cmd.trim()}'`,
        "  Tapez 'help' pour voir les commandes disponibles.",
      ]);
    },
    [level, levels, addLines, hintsUsed, score, startTime]
  );

  const handleKeyDown = useCallback(
    (e) => {
      if (e.key === "Enter") {
        processCommand(input);
        setInput("");
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (commandHistory.length > 0) {
          const newIndex = historyIndex === -1 ? commandHistory.length - 1 : Math.max(0, historyIndex - 1);
          setHistoryIndex(newIndex);
          setInput(commandHistory[newIndex]);
        }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (historyIndex !== -1) {
          const newIndex = historyIndex + 1;
          if (newIndex >= commandHistory.length) {
            setHistoryIndex(-1);
            setInput("");
          } else {
            setHistoryIndex(newIndex);
            setInput(commandHistory[newIndex]);
          }
        }
      }
    },
    [input, processCommand, commandHistory, historyIndex]
  );

  // ─── INTRO SCREEN ───

      <div

          minHeight: "100vh",

        />

            height: "400px",

          }}
        />
        <div style={{ textAlign: "center", zIndex: 1, maxWidth: "700px", padding: "20px" }}>

            <br />
            Traversez <span style={{ color: "#00b4ff" }}>7 niveaux</span> pour maîtriser les fondamentaux :
            <div style={{ marginTop: "14px", color: "#3a5a7a", fontSize: "12px" }}>

              <br />
              ▸ DNS · ▸ DHCP · ▸ Firewall · ▸ VLAN · ▸ Troubleshooting

              setShowIntro(false);
              addLines([
                ...LOGO_ASCII,

                "  Système initialisé. Bienvenue, technicien.",
                "",

                `  ${levels[0].mission}`,
                "",

            style={{
              background: "transparent",
              color: "#00b4ff",
              border: "1px solid #00b4ff",
              padding: "14px 50px",
              fontFamily: "inherit",
              fontSize: "14px",
              fontWeight: "bold",
              cursor: "pointer",
              letterSpacing: "3px",
              borderRadius: "2px",
              transition: "all 0.3s ease",
              boxShadow: "0 0 20px rgba(0,180,255,0.15)",
            }}
            onMouseOver={(e) => {
              e.target.style.background = "#00b4ff";
              e.target.style.color = "#020810";
              e.target.style.boxShadow = "0 0 40px rgba(0,180,255,0.4)";
            }}
            onMouseOut={(e) => {
              e.target.style.background = "transparent";
              e.target.style.color = "#00b4ff";
              e.target.style.boxShadow = "0 0 20px rgba(0,180,255,0.15)";
            }}
          >
            CONNECTER AU RÉSEAU
          </button>
        </div>
      </div>
    );
  }

  const currentLevel = levels[level];

  // ─── TERMINAL ───
  return (
    <div
      style={{
        minHeight: "100vh",
        background: "#020810",
        fontFamily: "'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace",
        display: "flex",
        flexDirection: "column",
        position: "relative",
        overflow: "hidden",
      }}
      onClick={focusInput}
    >
      {/* Grid bg */}
      <div
        style={{
          position: "absolute",
          inset: 0,
          backgroundImage:
            "linear-gradient(rgba(0,180,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(0,180,255,0.015) 1px, transparent 1px)",
          backgroundSize: "40px 40px",
          pointerEvents: "none",
        }}
      />

      {/* Header */}
      <div
        style={{
          background: "rgba(5,12,30,0.95)",
          borderBottom: "1px solid rgba(0,180,255,0.15)",
          padding: "10px 20px",
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
          zIndex: 10,
          backdropFilter: "blur(10px)",
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: "16px" }}>
          <span style={{ color: "#00b4ff", fontSize: "13px", fontWeight: "bold", letterSpacing: "1px" }}>
            ⬡ NET·OPS
          </span>
          <span style={{ color: "#1a2a3a" }}>│</span>
          <span style={{ color: "#f0c040", fontSize: "12px" }}>
            LVL {Math.min(level, levels.length - 2)}/{levels.length - 2}
          </span>
          <span style={{ color: "#1a2a3a" }}>│</span>
          <span style={{ color: "#3a7aaa", fontSize: "12px" }}>{currentLevel.title}</span>
        </div>
        <div style={{ display: "flex", gap: "14px", alignItems: "center" }}>
          <span style={{ color: "#2a4a6a", fontSize: "11px" }}>SCORE: {score}</span>
          <span style={{ color: "#2a4a6a", fontSize: "11px" }}>HINTS: {hintsUsed}</span>
          <div style={{ display: "flex", gap: "4px" }}>
            {levels.slice(0, -1).map((_, i) => (
              <div
                key={i}
                style={{
                  width: "8px",
                  height: "8px",
                  borderRadius: "50%",
                  background: i < level ? "#00b4ff" : i === level ? "#f0c040" : "#1a2a3a",
                  boxShadow: i < level ? "0 0 6px rgba(0,180,255,0.5)" : "none",
                  transition: "all 0.3s ease",
                }}
              />
            ))}
          </div>
        </div>
      </div>

      {/* Topic bar */}
      {currentLevel.topic && !currentLevel.victory && (
        <div
          style={{
            background: "rgba(0,180,255,0.04)",
            borderBottom: "1px solid rgba(0,180,255,0.08)",
            padding: "6px 20px",
            display: "flex",
            justifyContent: "space-between",
            fontSize: "11px",
            zIndex: 10,
          }}
        >
          <span style={{ color: "#3a6a8a" }}>📡 {currentLevel.topic}</span>
          <span style={{ color: "#2a4a6a" }}>
            {currentLevel.mission && currentLevel.mission.length > 80
              ? currentLevel.mission.substring(0, 77) + "..."
              : currentLevel.mission}
          </span>
        </div>
      )}

      {/* Terminal body */}
      <div
        ref={scrollRef}
        style={{
          flex: 1,
          overflowY: "auto",
          padding: "16px 20px",
          paddingBottom: "80px",
          zIndex: 1,
        }}
      >
        {lines.map((line, i) => {
          let color = "#7a9ab8";
          if (line.startsWith("✓")) color = "#00cc66";
          else if (line.startsWith("✗") || line.startsWith("⚠")) color = "#ff4444";
          else if (line.startsWith("→")) color = "#00b4ff";
          else if (line.startsWith("⟳")) color = "#f0c040";
          else if (line.startsWith("📖") || line.startsWith("━")) color = "#00b4ff";
          else if (line.startsWith("┌─ root")) color = "#3a6a8a";
          else if (line.startsWith("└─▸")) color = "#00b4ff";
          else if (line.startsWith("  ╔") || line.startsWith("  ║") || line.startsWith("  ╠") || line.startsWith("  ╚"))
            color = "#4a7a9a";
          else if (line.startsWith("⬡")) color = "#f0c040";

          return (
            <div
              key={i}
              style={{
                color,
                fontSize: "13px",
                lineHeight: "1.6",
                whiteSpace: "pre",
                minHeight: line === "" ? "8px" : "auto",
              }}
            >
              {line}
            </div>
          );
        })}
      </div>

      {/* Input bar */}
      <div
        style={{
          position: "fixed",
          bottom: 0,
          left: 0,
          right: 0,
          background: "rgba(5,12,30,0.97)",
          borderTop: "1px solid rgba(0,180,255,0.15)",
          padding: "12px 20px",
          display: "flex",
          alignItems: "center",
          gap: "10px",
          zIndex: 20,
          backdropFilter: "blur(10px)",
        }}
      >
        <span style={{ color: "#00b4ff", fontSize: "13px", fontWeight: "bold" }}>root@netops:~$</span>
        <input
          ref={inputRef}
          type="text"
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={handleKeyDown}
          autoFocus
          spellCheck={false}
          autoComplete="off"
          autoCapitalize="off"
          style={{
            flex: 1,
            background: "transparent",
            border: "none",
            outline: "none",
            color: "#c8dcea",
            fontFamily: "inherit",
            fontSize: "13px",
            caretColor: "#00b4ff",
          }}
          placeholder={currentLevel.victory ? "restart" : "Tapez une commande..."}
        />
      </div>
    </div>
  );
}


        /* --------------------------*/

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NetworkGame />);
    </script>
</body>
</html>
