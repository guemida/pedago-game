<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 Réseau & Infra — Challenge Terminal</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="shared/utils.js"></script>
    <script src="data/network-levels.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>

const h = React.createElement;
const { useState, useEffect, useRef, useCallback } = React;

// shuffle and pick provided by shared/utils.js
// level data + ASCII art provided by data/network-levels.js (NETWORK_LEVELS)

// ─── Main Component ───
function NetworkGame() {
  const [levels, setLevels] = useState(() => NETWORK_LEVELS.generate());
  const [level, setLevel] = useState(0);
  const [lines, setLines] = useState([]);
  const [input, setInput] = useState("");
  const [showIntro, setShowIntro] = useState(true);
  const [hintsUsed, setHintsUsed] = useState(0);
  const [commandHistory, setCommandHistory] = useState([]);
  const [historyIndex, setHistoryIndex] = useState(-1);
  const [startTime] = useState(Date.now());
  const [score, setScore] = useState(0);

  const inputRef = useRef(null);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [lines]);

  const focusInput = useCallback(() => {
    if (inputRef.current) inputRef.current.focus();
  }, []);

  useEffect(() => {
    focusInput();
  }, [showIntro, focusInput]);

  const addLines = useCallback((newLines) => {
    setLines((prev) => [...prev, ...newLines]);
  }, []);

  const processCommand = useCallback(
    (cmd) => {
      const trimmed = cmd.trim().toLowerCase();
      if (!trimmed) return;

      setCommandHistory((prev) => [...prev, trimmed]);
      setHistoryIndex(-1);
      addLines([``, `┌─ root@netops:~$`, `└─▸ ${cmd.trim()}`]);

      const currentLevel = levels[level];

      // Global commands
      if (trimmed === "clear") {
        setLines([]);
        return;
      }
      if (trimmed === "mission") {
        addLines(["", `📋 MISSION : ${currentLevel.mission}`]);
        return;
      }
      if (trimmed === "hint") {
        setHintsUsed((hh) => hh + 1);
        addLines(["", `💡 INDICE : ${currentLevel.hint}`]);
        return;
      }
      if (trimmed === "score") {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        addLines([
          "",
          `📊 Score: ${score} pts | Niveau: ${level}/${levels.length - 2} | Hints: ${hintsUsed} | Temps: ${Math.floor(elapsed / 60)}m${elapsed % 60}s`,
        ]);
        return;
      }
      if (trimmed === "restart" && currentLevel.victory) {
        const newLevels = NETWORK_LEVELS.generate();
        setLevels(newLevels);
        setLevel(0);
        setLines([]);
        setHintsUsed(0);
        setScore(0);
        setShowIntro(true);
        return;
      }

      // Check custom checkWin
      if (currentLevel.checkWin && currentLevel.checkWin(trimmed)) {
        addLines(["", ...currentLevel.winResponse]);
        setScore((s) => s + 150);
        setTimeout(() => {
          setLevel((l) => l + 1);
          addLines(["", "━".repeat(50), ""]);
          const next = levels[level + 1];
          if (next && !next.victory) {
            addLines([
              `⬡ NIVEAU ${level + 1} — ${next.title}`,
              `  Sujet : ${next.topic}`,
              `  ${next.mission}`,
              "",
              "  Tapez 'help' pour les commandes disponibles.",
            ]);
          } else if (next && next.victory) {
            addLines(NETWORK_LEVELS.VICTORY_ASCII);
          }
        }, 500);
        return;
      }

      // Check defaultResponse
      if (currentLevel.defaultResponse) {
        const resp = currentLevel.defaultResponse(trimmed);
        if (resp) {
          addLines(["", ...resp]);
          return;
        }
      }

      // Check static commands
      if (currentLevel.commands[trimmed]) {
        const cmdDef = currentLevel.commands[trimmed];
        addLines(["", ...cmdDef.response]);
        if (cmdDef.nextLevel) {
          setScore((s) => s + 100);
          setTimeout(() => {
            setLevel((l) => l + 1);
            addLines(["", "━".repeat(50), ""]);
            const next = levels[level + 1];
            if (next && !next.victory) {
              addLines([
                `⬡ NIVEAU ${level + 1} — ${next.title}`,
                `  Sujet : ${next.topic}`,
                `  ${next.mission}`,
                "",
                "  Tapez 'help' pour les commandes disponibles.",
              ]);
            } else if (next && next.victory) {
              addLines(NETWORK_LEVELS.VICTORY_ASCII);
            }
          }, 500);
        }
        return;
      }

      // Unknown command
      addLines([
        "",
        `✗ Commande inconnue : '${cmd.trim()}'`,
        "  Tapez 'help' pour voir les commandes disponibles.",
      ]);
    },
    [level, levels, addLines, hintsUsed, score, startTime]
  );

  const handleKeyDown = useCallback(
    (e) => {
      if (e.key === "Enter") {
        processCommand(input);
        setInput("");
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (commandHistory.length > 0) {
          const newIndex = historyIndex === -1 ? commandHistory.length - 1 : Math.max(0, historyIndex - 1);
          setHistoryIndex(newIndex);
          setInput(commandHistory[newIndex]);
        }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (historyIndex !== -1) {
          const newIndex = historyIndex + 1;
          if (newIndex >= commandHistory.length) {
            setHistoryIndex(-1);
            setInput("");
          } else {
            setHistoryIndex(newIndex);
            setInput(commandHistory[newIndex]);
          }
        }
      }
    },
    [input, processCommand, commandHistory, historyIndex]
  );

  // ─── INTRO SCREEN ───
  if (showIntro) {
    return h("div", {
      style: {
        minHeight: "100vh",
        background: "linear-gradient(180deg, #020810 0%, #0a1628 50%, #020810 100%)",
        display: "flex",
        justifyContent: "center",
        alignItems: "center",
        fontFamily: "'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace",
        overflow: "hidden",
        position: "relative",
      }
    },
      h("div", {
        style: {
          position: "absolute",
          inset: 0,
          backgroundImage: "linear-gradient(rgba(0,180,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,180,255,0.03) 1px, transparent 1px)",
          backgroundSize: "40px 40px",
        }
      }),
      h("div", {
        style: {
          position: "absolute",
          top: "30%",
          left: "50%",
          transform: "translate(-50%, -50%)",
          width: "600px",
          height: "400px",
          background: "radial-gradient(ellipse, rgba(0,150,255,0.08) 0%, transparent 70%)",
          pointerEvents: "none",
        }
      }),
      h("div", { style: { textAlign: "center", zIndex: 1, maxWidth: "700px", padding: "20px" } },
        h("pre", {
          style: {
            color: "#00b4ff",
            fontSize: "13px",
            lineHeight: "1.4",
            textShadow: "0 0 20px rgba(0,180,255,0.4)",
            marginBottom: "30px",
          }
        }, NETWORK_LEVELS.LOGO_ASCII.join("\n")),
        h("div", { style: { color: "#5a7a9a", fontSize: "13px", lineHeight: "1.8", marginBottom: "35px" } },
          "Vous êtes le nouveau technicien réseau.",
          h("br"),
          "Traversez ",
          h("span", { style: { color: "#00b4ff" } }, "7 niveaux"),
          " pour maîtriser les fondamentaux :",
          h("div", { style: { marginTop: "14px", color: "#3a5a7a", fontSize: "12px" } },
            "▸ Scan réseau & connectivité · ▸ Ping & Traceroute · ▸ Subnetting",
            h("br"),
            "▸ DNS · ▸ DHCP · ▸ Firewall · ▸ VLAN · ▸ Troubleshooting"
          )
        ),
        h("button", {
          onClick: () => {
            setShowIntro(false);
            addLines([
              ...NETWORK_LEVELS.LOGO_ASCII,
              "",
              "  Système initialisé. Bienvenue, technicien.",
              "",
              `⬡ NIVEAU 0 — ${levels[0].title}`,
              `  ${levels[0].mission}`,
              "",
            ]);
          },
          style: {
            background: "transparent",
            color: "#00b4ff",
            border: "1px solid #00b4ff",
            padding: "14px 50px",
            fontFamily: "inherit",
            fontSize: "14px",
            fontWeight: "bold",
            cursor: "pointer",
            letterSpacing: "3px",
            borderRadius: "2px",
            transition: "all 0.3s ease",
            boxShadow: "0 0 20px rgba(0,180,255,0.15)",
          },
          onMouseOver: (e) => {
            e.target.style.background = "#00b4ff";
            e.target.style.color = "#020810";
            e.target.style.boxShadow = "0 0 40px rgba(0,180,255,0.4)";
          },
          onMouseOut: (e) => {
            e.target.style.background = "transparent";
            e.target.style.color = "#00b4ff";
            e.target.style.boxShadow = "0 0 20px rgba(0,180,255,0.15)";
          }
        }, "CONNECTER AU RÉSEAU")
      )
    );
  }

  const currentLevel = levels[level];

  // ─── TERMINAL ───
  return h("div", {
    style: {
      minHeight: "100vh",
      background: "#020810",
      fontFamily: "'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace",
      display: "flex",
      flexDirection: "column",
      position: "relative",
      overflow: "hidden",
    },
    onClick: focusInput
  },
    // Grid bg
    h("div", {
      style: {
        position: "absolute",
        inset: 0,
        backgroundImage: "linear-gradient(rgba(0,180,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(0,180,255,0.015) 1px, transparent 1px)",
        backgroundSize: "40px 40px",
        pointerEvents: "none",
      }
    }),
    // Header
    h("div", {
      style: {
        background: "rgba(5,12,30,0.95)",
        borderBottom: "1px solid rgba(0,180,255,0.15)",
        padding: "10px 20px",
        display: "flex",
        justifyContent: "space-between",
        alignItems: "center",
        zIndex: 10,
        backdropFilter: "blur(10px)",
      }
    },
      h("div", { style: { display: "flex", alignItems: "center", gap: "16px" } },
        h("span", { style: { color: "#00b4ff", fontSize: "13px", fontWeight: "bold", letterSpacing: "1px" } }, "⬡ NET·OPS"),
        h("span", { style: { color: "#1a2a3a" } }, "│"),
        h("span", { style: { color: "#f0c040", fontSize: "12px" } }, `LVL ${Math.min(level, levels.length - 2)}/${levels.length - 2}`),
        h("span", { style: { color: "#1a2a3a" } }, "│"),
        h("span", { style: { color: "#3a7aaa", fontSize: "12px" } }, currentLevel.title)
      ),
      h("div", { style: { display: "flex", gap: "14px", alignItems: "center" } },
        h("span", { style: { color: "#2a4a6a", fontSize: "11px" } }, `SCORE: ${score}`),
        h("span", { style: { color: "#2a4a6a", fontSize: "11px" } }, `HINTS: ${hintsUsed}`),
        h("div", { style: { display: "flex", gap: "4px" } },
          levels.slice(0, -1).map((_, i) =>
            h("div", {
              key: i,
              style: {
                width: "8px",
                height: "8px",
                borderRadius: "50%",
                background: i < level ? "#00b4ff" : i === level ? "#f0c040" : "#1a2a3a",
                boxShadow: i < level ? "0 0 6px rgba(0,180,255,0.5)" : "none",
                transition: "all 0.3s ease",
              }
            })
          )
        )
      )
    ),
    // Topic bar
    (currentLevel.topic && !currentLevel.victory)
      ? h("div", {
          style: {
            background: "rgba(0,180,255,0.04)",
            borderBottom: "1px solid rgba(0,180,255,0.08)",
            padding: "6px 20px",
            display: "flex",
            justifyContent: "space-between",
            fontSize: "11px",
            zIndex: 10,
          }
        },
          h("span", { style: { color: "#3a6a8a" } }, `📡 ${currentLevel.topic}`),
          h("span", { style: { color: "#2a4a6a" } },
            currentLevel.mission && currentLevel.mission.length > 80
              ? currentLevel.mission.substring(0, 77) + "..."
              : currentLevel.mission
          )
        )
      : null,
    // Terminal body
    h("div", {
      ref: scrollRef,
      style: {
        flex: 1,
        overflowY: "auto",
        padding: "16px 20px",
        paddingBottom: "80px",
        zIndex: 1,
      }
    },
      lines.map((line, i) => {
        let color = "#7a9ab8";
        if (line.startsWith("✓")) color = "#00cc66";
        else if (line.startsWith("✗") || line.startsWith("⚠")) color = "#ff4444";
        else if (line.startsWith("→")) color = "#00b4ff";
        else if (line.startsWith("⟳")) color = "#f0c040";
        else if (line.startsWith("📖") || line.startsWith("━")) color = "#00b4ff";
        else if (line.startsWith("┌─ root")) color = "#3a6a8a";
        else if (line.startsWith("└─▸")) color = "#00b4ff";
        else if (line.startsWith("  ╔") || line.startsWith("  ║") || line.startsWith("  ╠") || line.startsWith("  ╚"))
          color = "#4a7a9a";
        else if (line.startsWith("⬡")) color = "#f0c040";

        return h("div", {
          key: i,
          style: {
            color,
            fontSize: "13px",
            lineHeight: "1.6",
            whiteSpace: "pre",
            minHeight: line === "" ? "8px" : "auto",
          }
        }, line);
      })
    ),
    // Input bar
    h("div", {
      style: {
        position: "fixed",
        bottom: 0,
        left: 0,
        right: 0,
        background: "rgba(5,12,30,0.97)",
        borderTop: "1px solid rgba(0,180,255,0.15)",
        padding: "12px 20px",
        display: "flex",
        alignItems: "center",
        gap: "10px",
        zIndex: 20,
        backdropFilter: "blur(10px)",
      }
    },
      h("span", { style: { color: "#00b4ff", fontSize: "13px", fontWeight: "bold" } }, "root@netops:~$"),
      h("input", {
        ref: inputRef,
        type: "text",
        value: input,
        onChange: (e) => setInput(e.target.value),
        onKeyDown: handleKeyDown,
        autoFocus: true,
        spellCheck: false,
        autoComplete: "off",
        autoCapitalize: "off",
        style: {
          flex: 1,
          background: "transparent",
          border: "none",
          outline: "none",
          color: "#c8dcea",
          fontFamily: "inherit",
          fontSize: "13px",
          caretColor: "#00b4ff",
        },
        placeholder: currentLevel.victory ? "restart" : "Tapez une commande..."
      })
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(NetworkGame));

    </script>
</body>
</html>
