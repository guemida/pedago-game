<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐧 Linux & Sysadmin — Challenge Terminal</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="shared/utils.js"></script>
    <script src="shared/rain.js"></script>
    <script src="shared/game-engine.js"></script>
    <script src="shared/level-builders.js"></script>
    <script src="data/linux-levels.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>

var L = LINUX_LEVELS;

var PROFILES = {
  "débutant": {
    label: "🟢 DÉBUTANT", desc: "Lycéen / Première fois sur Linux", color: "#84cc16",
    levels: function () { return [buildLevel(L.nav), buildLevel(L.fileops), buildLevel(L.perms), buildLevel(L.grep), buildLevel(L.process)]; },
  },
  "intermédiaire": {
    label: "🟡 INTERMÉDIAIRE", desc: "Étudiant IT / Bac+2", color: "#facc15",
    levels: function () { return [buildLevel(L.nav), buildLevel(L.fileops), buildLevel(L.perms), buildLevel(L.grep), buildLevel(L.process), buildLevel(L.users), buildLevel(L.disk)]; },
  },
  "expert": {
    label: "🔴 EXPERT", desc: "M1/M2 / Sysadmin", color: "#f87171",
    levels: function () { return [buildLevel(L.nav), buildLevel(L.fileops), buildLevel(L.perms), buildLevel(L.grep), buildLevel(L.process), buildLevel(L.users), buildLevel(L.disk), buildLevel(L.cron), buildLevel(L.netlinux), buildLevel(L.service), buildLevel(L.shell)]; },
  },
};

var root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(GameEngine, {
  title: "LINUX TERMINAL",
  icon: "🐧",
  profiles: PROFILES,
  rainConfig: { chars: "$ sudo apt chmod grep find ls cd cat rm cp mv mkdir df du ps kill top ssh scp rsync cron bash /etc /var /home root user", colors: ["#84cc16", "#a3e635", "#bef264", "#d9f99d"], fontSize: 14, speed: 55, opacity: 0.12, fadeAlpha: 0.04 },
  backgroundColor: "#0a0f0a",
  headerBg: "#0f150f",
  headerBorder: "#1a2a1a",
  themeColor: "#84cc16",
  terminalColors: { system: "#84cc16", input: "#e2e8f0", success: "#4ade80", error: "#f87171", hint: "#facc15", mission: "#94a3b8", response: "#7a9a78" },
  promptSymbol: "user@srv:~$",
  inputPlaceholder: "Tapez votre commande...",
  subtitleText: "MAÎTRISEZ LE SHELL",
  victoryTitle: "SYSADMIN MASTER",
  baseScores: { "débutant": 500, "intermédiaire": 750, "expert": 1000 },
  getInputPrefix: function (original) { return "user@srv:~$ " + original; },
  getUnknownMsg: function (original) { return "bash: " + original.split(" ")[0] + ": commande non reconnue. Tapez 'help'."; },
  topicIcon: "🐧"
}));

    </script>
</body>
</html>
