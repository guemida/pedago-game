// --- LEVEL: SELECT Basics ---
var generateSelectLevel = function () {
  var tables = shuffle([
    {
      name: "employes",
      schema: "id | nom       | poste          | salaire | ville",
      rows: [
        " 1 | Dupont    | Développeur    |  45000  | Paris",
        " 2 | Martin    | Designer       |  38000  | Lyon",
        " 3 | Bernard   | Chef de projet |  55000  | Paris",
        " 4 | Petit     | Développeur    |  42000  | Marseille",
        " 5 | Moreau    | DBA            |  48000  | Paris",
      ],
      q: "Écrivez une requête pour afficher le nom et le salaire de tous les employés.",
      a: function (sql) { return /select\s+.*nom.*salaire.*from\s+employes/i.test(sql.replace(/,/g,' ')) || /select\s+.*salaire.*nom.*from\s+employes/i.test(sql.replace(/,/g,' ')); },
      win: "✓ CORRECT ! SELECT nom, salaire FROM employes; — La base de toute requête SQL.",
    },
    {
      name: "produits",
      schema: "id | nom_produit   | categorie  | prix  | stock",
      rows: [
        " 1 | MacBook Pro   | Laptop     | 2499  | 15",
        " 2 | iPhone 15     | Smartphone | 1199  | 42",
        " 3 | AirPods Pro   | Audio      |  279  | 88",
        " 4 | iPad Air      | Tablette   |  699  | 23",
        " 5 | Magic Mouse   | Accessoire |   99  | 156",
      ],
      q: "Écrivez une requête pour afficher tous les produits (toutes les colonnes).",
      a: function (sql) { return /select\s+\*\s+from\s+produits/i.test(sql); },
      win: "✓ PARFAIT ! SELECT * FROM produits; — L'étoile (*) sélectionne toutes les colonnes.",
    },
  ]);
  var t = tables[0];
  var tableDisplay = [t.schema, "-".repeat(t.schema.length)].concat(t.rows).join("\n");
  return {
    id: "select", title: "SELECT — Les Bases",
    mission: "Table \"" + t.name + "\" :\n\n" + tableDisplay + "\n\n" + t.q,
    hint: "La syntaxe de base : SELECT <colonnes> FROM <table>",
    topic: "SELECT Basique",
    commands: {
      help: { response: ["╔═══════════════════════════════════════════╗", "║  Tapez votre requête SQL directement      ║", "║  hint    - Obtenir un indice              ║", "║  explain - Mini-cours sur SELECT          ║", "║  mission - Revoir l'énoncé                ║", "║  schema  - Voir la structure de la table  ║", "╚═══════════════════════════════════════════╝"] },
      explain: { response: ["📖 SELECT — REQUÊTE DE BASE", "━━━━━━━━━━━━━━━━━━━━━━━━━━━", "SELECT est le mot-clé le plus utilisé en SQL.", "", "Syntaxe :", "  SELECT colonne1, colonne2 FROM table;", "  SELECT * FROM table;  -- toutes les colonnes", "", "Exemples :", "  SELECT nom, email FROM clients;", "  SELECT * FROM commandes;", "", "* = toutes les colonnes (pratique mais éviter en prod)"] },
      schema: { response: ["📋 STRUCTURE :", t.schema] },
    },
    checkWin: function (input) { return t.a(input); },
    winResponse: [t.win],
    defaultResponse: function (input) {
      if (/^select/i.test(input)) return ["✗ Requête incorrecte. Vérifiez les colonnes et le nom de la table.", "  Tapez 'hint' pour un indice."];
      return null;
    },
  };
};

// --- LEVEL: WHERE ---
var generateWhereLevel = function () {
  var scenarios = shuffle([
    {
      table: "employes",
      schema: "id | nom       | poste          | salaire | ville",
      rows: [" 1 | Dupont    | Développeur    |  45000  | Paris", " 2 | Martin    | Designer       |  38000  | Lyon", " 3 | Bernard   | Chef de projet |  55000  | Paris", " 4 | Petit     | Développeur    |  42000  | Marseille", " 5 | Moreau    | DBA            |  48000  | Paris"],
      q: "Affichez les employés qui travaillent à Paris.",
      a: function (sql) { return /select\s+.*from\s+employes\s+where\s+ville\s*=\s*'paris'/i.test(sql); },
      win: "✓ EXACT ! WHERE ville = 'Paris' filtre les résultats. 3 employés parisiens trouvés !",
      hint: "Ajoutez WHERE colonne = 'valeur' après FROM.",
    },
    {
      table: "produits",
      schema: "id | nom_produit | prix  | stock | categorie",
      rows: [" 1 | Laptop Pro  | 1299  | 8     | Laptop", " 2 | Souris RGB  |   49  | 200   | Accessoire", " 3 | Écran 27\"  |  399  | 15    | Moniteur", " 4 | Clavier     |   89  | 45    | Accessoire", " 5 | SSD 1To     |   79  | 120   | Stockage"],
      q: "Affichez les produits dont le prix est supérieur à 100.",
      a: function (sql) { return /select\s+.*from\s+produits\s+where\s+prix\s*>\s*100/i.test(sql); },
      win: "✓ BIEN JOUÉ ! WHERE prix > 100 renvoie le Laptop et l'Écran.",
      hint: "Utilisez l'opérateur > pour comparer des valeurs numériques.",
    },
  ]);
  var s = scenarios[0];
  var tableDisplay = [s.schema, "-".repeat(s.schema.length)].concat(s.rows).join("\n");
  return {
    id: "where", title: "WHERE — Filtrer",
    mission: "Table \"" + s.table + "\" :\n\n" + tableDisplay + "\n\n" + s.q,
    hint: s.hint, topic: "Clause WHERE",
    commands: {
      help: { response: ["╔═══════════════════════════════════════════╗", "║  Tapez votre requête SQL directement      ║", "║  hint    - Obtenir un indice              ║", "║  explain - Mini-cours sur WHERE           ║", "║  mission - Revoir l'énoncé                ║", "╚═══════════════════════════════════════════╝"] },
      explain: { response: ["📖 WHERE — FILTRAGE", "━━━━━━━━━━━━━━━━━━━━", "WHERE filtre les lignes selon une condition.", "", "Opérateurs :", "  = égal       != ou <> différent", "  > supérieur  < inférieur", "  >= sup ou égal  <= inf ou égal", "  LIKE 'pattern%'  (recherche partielle)", "  IN ('a','b','c')  (liste de valeurs)", "  BETWEEN x AND y  (intervalle)", "  IS NULL / IS NOT NULL", "", "Exemple :", "  SELECT * FROM employes WHERE salaire > 40000;"] },
    },
    checkWin: function (input) { return s.a(input); },
    winResponse: [s.win],
    defaultResponse: function (input) {
      if (/^select/i.test(input)) {
        if (!/where/i.test(input)) return ["✗ Il manque la clause WHERE pour filtrer.", "  Tapez 'hint' pour un indice."];
        return ["✗ Presque ! Vérifiez la condition de filtrage.", "  Tapez 'hint' pour un indice."];
      }
      return null;
    },
  };
};

// --- LEVEL: ORDER BY / LIMIT ---

      table: "employes",
      schema: "id | nom       | poste          | salaire | ville",

      win: "✓ PARFAIT ! ORDER BY salaire DESC LIMIT 3 → Bernard (55K), Moreau (48K), Dupont (45K).",
      hint: "ORDER BY colonne DESC pour trier décroissant, LIMIT n pour limiter les résultats.",

  return {
    id: "orderby", title: "ORDER BY & LIMIT",
    mission: "Table \"" + s.table + "\" :\n\n" + tableDisplay + "\n\n" + s.q,
    hint: s.hint, topic: "Tri & Pagination",
    commands: {
      help: { response: ["╔═══════════════════════════════════════════╗", "║  Tapez votre requête SQL directement      ║", "║  hint    - Obtenir un indice              ║", "║  explain - Mini-cours ORDER BY            ║", "║  mission - Revoir l'énoncé                ║", "╚═══════════════════════════════════════════╝"] },
      explain: { response: ["📖 ORDER BY & LIMIT", "━━━━━━━━━━━━━━━━━━━━", "ORDER BY trie les résultats :", "  ASC = croissant (défaut)", "  DESC = décroissant", "", "LIMIT restreint le nombre de résultats :", "  LIMIT 10 → max 10 lignes", "  LIMIT 5 OFFSET 10 → 5 lignes à partir de la 11ème", "", "Exemples :", "  SELECT * FROM produits ORDER BY prix DESC;", "  SELECT * FROM logs ORDER BY date DESC LIMIT 100;", "  SELECT * FROM users LIMIT 20 OFFSET 40; -- page 3"] },
    },
    checkWin: function (input) { return s.a(input); },
    winResponse: [s.win],
    defaultResponse: function (input) {
      if (/^select/i.test(input)) return ["✗ Vérifiez ORDER BY et/ou LIMIT.", "  Tapez 'hint' pour un indice."];
      return null;
    },

};

// --- LEVEL: GROUP BY / Agrégation ---
var generateGroupByLevel = function () {
  var s = pick([
    {
      table: "ventes",
      schema: "id | vendeur  | produit    | montant | date",
      rows: [" 1 | Alice    | Laptop     |  1200   | 2025-01-15", " 2 | Bob      | Souris     |    49   | 2025-01-16", " 3 | Alice    | Écran      |   399   | 2025-01-17", " 4 | Charlie  | Laptop     |  1200   | 2025-01-18", " 5 | Bob      | Clavier    |    89   | 2025-01-19", " 6 | Alice    | SSD        |    79   | 2025-01-20"],
      q: "Calculez le montant TOTAL des ventes par vendeur.",
      a: function (sql) { return /select\s+vendeur\s*,\s*sum\s*\(\s*montant\s*\)\s*.*from\s+ventes\s+group\s+by\s+vendeur/i.test(sql); },
      win: "✓ EXCELLENT ! Alice: 1678€, Bob: 138€, Charlie: 1200€. GROUP BY + SUM = agrégation !",
      hint: "SELECT vendeur, SUM(montant) FROM ... GROUP BY vendeur",
    },
    {
      table: "employes",
      schema: "id | nom       | departement | salaire",
      rows: [" 1 | Dupont    | IT          |  45000", " 2 | Martin    | RH          |  38000", " 3 | Bernard   | IT          |  55000", " 4 | Petit     | Marketing   |  42000", " 5 | Moreau    | IT          |  48000", " 6 | Leroy     | RH          |  41000"],
      q: "Comptez le nombre d'employés par département.",
      a: function (sql) { return /select\s+departement\s*,\s*count\s*\(.*\)\s*.*from\s+employes\s+group\s+by\s+departement/i.test(sql); },
      win: "✓ BIEN ! IT: 3, RH: 2, Marketing: 1. COUNT(*) avec GROUP BY = comptage par groupe.",
      hint: "SELECT departement, COUNT(*) FROM ... GROUP BY departement",
    },
  ]);
  var tableDisplay = [s.schema, "-".repeat(s.schema.length)].concat(s.rows).join("\n");
  return {
    id: "groupby", title: "GROUP BY & AGRÉGATION",
    mission: "Table \"" + s.table + "\" :\n\n" + tableDisplay + "\n\n" + s.q,
    hint: s.hint, topic: "Agrégation de Données",
    commands: {
      help: { response: ["╔═══════════════════════════════════════════╗", "║  Tapez votre requête SQL directement      ║", "║  hint    - Obtenir un indice              ║", "║  explain - Mini-cours GROUP BY            ║", "║  mission - Revoir l'énoncé                ║", "╚═══════════════════════════════════════════╝"] },
      explain: { response: ["📖 GROUP BY & FONCTIONS D'AGRÉGATION", "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", "GROUP BY regroupe les lignes par valeur commune.", "", "Fonctions d'agrégation :", "  COUNT(*) — nombre de lignes", "  SUM(col) — somme", "  AVG(col) — moyenne", "  MIN(col) — minimum", "  MAX(col) — maximum", "", "Exemple :", "  SELECT ville, COUNT(*), AVG(salaire)", "  FROM employes", "  GROUP BY ville;", "", "HAVING = WHERE pour les groupes :", "  GROUP BY ville HAVING COUNT(*) > 2"] },
    },
    checkWin: function (input) { return s.a(input); },
    winResponse: [s.win],
    defaultResponse: function (input) {
      if (/^select/i.test(input)) {
        if (!/group\s+by/i.test(input)) return ["✗ Il manque GROUP BY pour regrouper les résultats.", "  Tapez 'hint' pour un indice."];
        return ["✗ Presque ! Vérifiez la fonction d'agrégation.", "  Tapez 'hint' pour un indice."];
      }
      return null;
    },
  };
};

// --- LEVEL: JOIN ---
var generateJoinLevel = function () {
  var s = pick([
    {
      tables: [
        { name: "clients", schema: "id | nom       | ville", rows: [" 1 | Alice     | Paris", " 2 | Bob       | Lyon", " 3 | Charlie   | Marseille"] },
        { name: "commandes", schema: "id | client_id | produit    | montant", rows: [" 1 |    1      | Laptop     |  1200", " 2 |    1      | Souris     |    49", " 3 |    2      | Écran      |   399", " 4 |    3      | Clavier    |    89"] },
      ],
      q: "Affichez le nom du client et le produit pour chaque commande (jointure).",
      a: function (sql) { return /select\s+.*nom.*produit.*from\s+.*join\s+.*(on|using)/i.test(sql) || /select\s+.*produit.*nom.*from\s+.*join\s+.*(on|using)/i.test(sql); },
      win: "✓ PARFAIT ! JOIN lie les tables par clé étrangère. Alice→Laptop, Alice→Souris, Bob→Écran, Charlie→Clavier.",
      hint: "SELECT ... FROM clients JOIN commandes ON clients.id = commandes.client_id",
    },
  ]);
  var tableDisplays = s.tables.map(function (t) { return "Table \"" + t.name + "\" :\n" + t.schema + "\n" + "-".repeat(t.schema.length) + "\n" + t.rows.join("\n"); }).join("\n\n");
  return {
    id: "join", title: "JOIN — Jointures",
    mission: tableDisplays + "\n\n" + s.q,
    hint: s.hint, topic: "Jointures SQL",
    commands: {
      help: { response: ["╔═══════════════════════════════════════════╗", "║  Tapez votre requête SQL directement      ║", "║  hint    - Obtenir un indice              ║", "║  explain - Mini-cours JOIN                ║", "║  mission - Revoir l'énoncé                ║", "╚═══════════════════════════════════════════╝"] },
      explain: { response: ["📖 JOIN — JOINTURES", "━━━━━━━━━━━━━━━━━━━━", "JOIN combine des lignes de 2+ tables :", "", "INNER JOIN : uniquement les correspondances", "  SELECT * FROM A JOIN B ON A.id = B.a_id;", "", "LEFT JOIN : tout de A + correspondances de B", "  SELECT * FROM A LEFT JOIN B ON A.id = B.a_id;", "", "RIGHT JOIN : tout de B + correspondances de A", "", "FULL JOIN : tout de A et B", "", "Clé étrangère = colonne qui référence une autre table", "  commandes.client_id → clients.id"] },
    },
    checkWin: function (input) { return s.a(input); },
    winResponse: [s.win],
    defaultResponse: function (input) {
      if (/^select/i.test(input)) {
        if (!/join/i.test(input)) return ["✗ Vous avez besoin d'un JOIN pour lier les deux tables.", "  Tapez 'hint' pour un indice."];
        if (!/on|using/i.test(input)) return ["✗ Il manque la condition ON pour spécifier la jointure.", "  Tapez 'hint' pour un indice."];
        return ["✗ Presque ! Vérifiez les colonnes et la condition de jointure.", "  Tapez 'hint' pour un indice."];
      }
      return null;
    },
  };
};

// --- LEVEL: INSERT / UPDATE / DELETE ---
var generateDMLLevel = function () {
  var scenarios = shuffle([
    {
      context: "Table 'employes' (id, nom, poste, salaire, ville). Vous devez ajouter un nouvel employé : Sophie Durand, Data Analyst, 43000€, à Lyon.",
      q: "Écrivez la requête INSERT.",
      a: function (sql) { return /insert\s+into\s+employes/i.test(sql) && /sophie|durand/i.test(sql) && /data\s*analyst/i.test(sql); },
      win: "✓ INSERT INTO employes (nom, poste, salaire, ville) VALUES ('Sophie Durand', 'Data Analyst', 43000, 'Lyon');",
      hint: "INSERT INTO table (col1, col2, ...) VALUES (val1, val2, ...)",
    },
    {
      context: "Table 'produits' (id, nom, prix, stock). Le produit id=3 a changé de prix : nouveau prix 349€.",
      q: "Écrivez la requête UPDATE.",
      a: function (sql) { return /update\s+produits\s+set\s+prix\s*=\s*349/i.test(sql) && /where\s+id\s*=\s*3/i.test(sql); },
      win: "✓ UPDATE produits SET prix = 349 WHERE id = 3; — TOUJOURS mettre un WHERE avec UPDATE !",
      hint: "UPDATE table SET colonne = valeur WHERE condition",
    },
  ]);
  var s = scenarios[0];
  return {
    id: "dml", title: "INSERT / UPDATE / DELETE",
    mission: "📋 CONTEXTE :\n" + s.context + "\n\n" + s.q,
    hint: s.hint, topic: "Manipulation de Données (DML)",
    commands: {
      help: { response: ["╔═══════════════════════════════════════════╗", "║  Tapez votre requête SQL directement      ║", "║  hint    - Obtenir un indice              ║", "║  explain - Mini-cours DML                 ║", "║  mission - Revoir l'énoncé                ║", "╚═══════════════════════════════════════════╝"] },
      explain: { response: ["📖 DML — DATA MANIPULATION LANGUAGE", "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", "INSERT — Ajouter des lignes :", "  INSERT INTO table (cols) VALUES (vals);", "", "UPDATE — Modifier des lignes :", "  UPDATE table SET col = val WHERE condition;", "  ⚠ SANS WHERE → modifie TOUTES les lignes !", "", "DELETE — Supprimer des lignes :", "  DELETE FROM table WHERE condition;", "  ⚠ SANS WHERE → supprime TOUT !", "", "Règle d'or : TOUJOURS tester avec SELECT d'abord,", "puis transformer en UPDATE/DELETE."] },

    defaultResponse: function (input) {

      return null;
    },
  };
};

  };
};

// --- LEVEL: CREATE TABLE / Modélisation ---
var generateCreateLevel = function () {
  var s = pick([
    {
