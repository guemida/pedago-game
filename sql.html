<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗄️ SQL & Bases de Données — Challenge Terminal</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="shared/utils.js"></script>
    <script src="shared/rain.js"></script>
    <script src="shared/game-engine.js"></script>
    <script src="shared/level-builders.js"></script>
    <script src="data/sql-levels.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>

var L = SQL_LEVELS;

var PROFILES = {
  "débutant": {
    label: "🟢 DÉBUTANT", desc: "Lycéen / Découverte SQL", color: "#06b6d4",
    levels: function () { return [buildLevel(L.select), buildLevel(L.where), buildLevel(L.orderby), buildLevel(L.groupby), buildLevel(L.dml)]; },
  },
  "intermédiaire": {
    label: "🟡 INTERMÉDIAIRE", desc: "Étudiant Bac+2 / Dev Junior", color: "#facc15",
    levels: function () { return [buildLevel(L.select), buildLevel(L.where), buildLevel(L.orderby), buildLevel(L.groupby), buildLevel(L.join), buildLevel(L.dml), buildLevel(L.subquery)]; },
  },
  "expert": {
    label: "🔴 EXPERT", desc: "M1/M2 / DBA", color: "#f87171",
    levels: function () { return [buildLevel(L.select), buildLevel(L.where), buildLevel(L.orderby), buildLevel(L.groupby), buildLevel(L.join), buildLevel(L.dml), buildLevel(L.subquery), buildLevel(L.create), buildLevel(L.index), buildLevel(L.normalisation), buildLevel(L.transaction)]; },
  },
};

var root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(GameEngine, {
  title: "SQL TERMINAL",
  icon: "🗄️",
  profiles: PROFILES,
  rainConfig: { chars: "SELECT FROM WHERE JOIN GROUP ORDER INSERT UPDATE DELETE CREATE INDEX TABLE INT VARCHAR NULL PRIMARY KEY FOREIGN", colors: ["#06b6d4", "#22d3ee", "#67e8f9", "#a5f3fc"], fontSize: 14, speed: 55, opacity: 0.12, fadeAlpha: 0.04 },
  backgroundColor: "#0a0f1a",
  headerBg: "#0f1724",
  headerBorder: "#1a2a3a",
  themeColor: "#06b6d4",
  terminalColors: { system: "#06b6d4", input: "#e2e8f0", success: "#4ade80", error: "#f87171", hint: "#facc15", mission: "#94a3b8", response: "#7a9ab8" },
  promptSymbol: "sql>",
  inputPlaceholder: "Tapez votre requête SQL...",
  subtitleText: "MAÎTRISEZ LES BASES DE DONNÉES",
  victoryTitle: "DATABASE MASTER",
  baseScores: { "débutant": 500, "intermédiaire": 750, "expert": 1000 },
  preprocessInput: function (original, trimmed) {
    return trimmed.startsWith("answer ") ? "answer " + original.slice(7) : trimmed;
  },
  getInputPrefix: function (original) { return "sql> " + original; },
  getUnknownMsg: function () { return "Commande non reconnue. Tapez 'help'."; },
  topicIcon: "🗄️"
}));

    </script>
</body>
</html>
