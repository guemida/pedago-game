<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ Cybersécurité — Challenge Terminal</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="shared/utils.js"></script>
    <script src="shared/rain.js"></script>
    <script src="shared/game-engine.js"></script>
    <script src="shared/level-builders.js"></script>
    <script src="data/cyber-levels.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>

// L holds both declarative levels (scan, osint, network) and the
// content pools (bruteforce, caesar, base64, sqli, phishing, hash)
// consumed by the procedural generators below.
var L = CYBER_LEVELS;

const caesarShift = (text, shift) => {
  let result = "";
  for (let c of text.toUpperCase()) {
    if (c >= "A" && c <= "Z") {
      result += String.fromCharCode(((c.charCodeAt(0) - 65 + shift + 26) % 26) + 65);
    } else {
      result += c;
    }
  }
  return result;
};

const generateBruteForceLevel = (difficulty) => {
  const chosen = pick(L.bruteforce.passwords[difficulty]);
  const maxAttempts = L.bruteforce.maxAttempts[difficulty];
  let attempts = 0;
  const commonPasswords = shuffle(L.bruteforce.wordlist);
  return {
    id: "bruteforce", title: "BRUTE FORCE",
    mission: "Le serveur demande un mot de passe. Vous avez " + maxAttempts + " tentatives. Testez avec 'try <password>'.",
    hint: chosen.hint, topic: "Mots de passe faibles & Brute force",
    commands: {
      help: { response: ["╔══════════════════════════════════════════════╗","║  try <mdp>     - Tester un mot de passe      ║","║  wordlist      - Passwords courants           ║","║  attempts      - Tentatives restantes         ║","║  explain       - En savoir plus               ║","╚══════════════════════════════════════════════╝"] },
      wordlist: { response: ["📋 Passwords fréquents :", ...commonPasswords.slice(0, 12).map((p, i) => "  " + (i + 1).toString().padStart(2) + ". " + p), "", "⚠ 80% des breaches impliquent des mots de passe faibles."] },
      explain: { response: ["📖 BRUTE FORCE","━━━━━━━━━━━━━━","Tester systématiquement tous les mots de passe possibles.","","Variantes :","  • Dictionnaire","  • Hybride (mots + variations)","  • Pur (toutes combinaisons)","","Outils : Hydra, John the Ripper, Hashcat.","Défense : rate limiting, 2FA, 12+ caractères."] },
    },
    defaultResponse: (input) => {
      if (input.startsWith("try ")) { const guess = input.slice(4).trim(); attempts++; if (guess === chosen.pass) return null; const remaining = maxAttempts - attempts; if (remaining <= 0) { attempts = 0; return ["✗ Plus de tentatives ! Password: " + chosen.pass, "→ Compteur réinitialisé."]; } return ["✗ Accès refusé. (" + remaining + " restantes)"]; }
      if (input === "attempts") return ["Tentatives: " + (maxAttempts - attempts) + "/" + maxAttempts];
      if (input === "retry") { attempts = 0; return ["⟳ Réinitialisé. " + maxAttempts + " tentatives."]; }
      return null;
    },
    checkWin: (input) => input.startsWith("try ") && input.slice(4).trim() === chosen.pass,
    winResponse: ["✓ ACCÈS ! Password cracké : \"" + chosen.pass + "\"", "  Trouvé en " + (attempts + 1) + " tentative(s).", "", "⚠ LEÇON :", "→ Ne jamais utiliser de passwords par défaut.", "→ Minimum 12 caractères variés.", "→ Gestionnaire de mots de passe (Bitwarden, KeePass).", "→ Activer le 2FA."],
  };
};

const generateCaesarLevel = (difficulty) => {
  const plaintext = pick(L.caesar.messages[difficulty]);
  const shift = pick(L.caesar.shifts[difficulty]);
  const ciphertext = caesarShift(plaintext, shift);
  return {
    id: "caesar", title: "CHIFFREMENT CÉSAR",
    mission: "Message intercepté : '" + ciphertext + "'. Utilisez 'caesar <texte> <décalage>' pour tester.",
    hint: difficulty === "débutant" ? "Testez: caesar " + ciphertext + " -" + shift : "Utilisez 'bruteforce caesar' pour tester les 25 shifts.",
    topic: "Cryptographie — Chiffrement de César",
    commands: {
      help: { response: ["╔══════════════════════════════════════════════╗","║  caesar <texte> <n>   - Appliquer décalage   ║","║  bruteforce caesar    - Tester les 25 shifts  ║","║  explain              - Comprendre César      ║","╚══════════════════════════════════════════════╝"] },
      "bruteforce caesar": { response: ["⟳ Test des 25 décalages :", "", ...Array.from({ length: 25 }, (_, i) => { const s = -(i + 1); const r = caesarShift(ciphertext, s); return "  ROT " + String(s).padStart(3) + " → " + r.slice(0, 40) + (r === plaintext ? " ◄◄◄ LISIBLE !" : ""); }), "", "→ Repérez le texte lisible !"] },
      explain: { response: ["📖 CHIFFREMENT DE CÉSAR","━━━━━━━━━━━━━━━━━━━━━━━","Chaque lettre décalée de N positions.","Faiblesse : 25 clés possibles.","Moderne : AES-256 (2²⁵⁶ clés)."] },
    },
    defaultResponse: (input) => {
      if (input.startsWith("caesar ")) { const parts = input.split(" "); const sh = parseInt(parts[parts.length - 1]); if (isNaN(sh)) return ["✗ Format: caesar <texte> <décalage>"]; const text = parts.slice(1, -1).join(" ").toUpperCase(); const result = caesarShift(text, sh); if (result === plaintext) return null; return ["→ " + result, "", "Pas le bon décalage..."]; }
      return null;
    },
    checkWin: (input) => { if (!input.startsWith("caesar ")) return false; const parts = input.split(" "); const sh = parseInt(parts[parts.length - 1]); if (isNaN(sh)) return false; return caesarShift(parts.slice(1, -1).join(" ").toUpperCase(), sh) === plaintext; },
    winResponse: ["✓ MESSAGE DÉCHIFFRÉ : " + plaintext, "  Décalage : " + shift, "", "⚠ LEÇON :", "→ César = cassable en secondes.", "→ Chiffrement moderne : clés 128-256 bits."],
  };
};

const generateBase64Level = (difficulty) => {
  const secret = pick(L.base64.secrets[difficulty]);
  const encoded = btoa(secret);
  return {
    id: "base64", title: "ENCODAGE BASE64",
    mission: "Données interceptées : '" + encoded + "'. Décodez avec 'decode <texte>'.",
    hint: "Tapez: decode " + encoded, topic: "Encodage vs Chiffrement",
    commands: {
      help: { response: ["╔══════════════════════════════════════════════╗","║  decode <texte>    - Décoder du Base64        ║","║  encode <texte>    - Encoder en Base64        ║","║  explain           - Comprendre Base64        ║","╚══════════════════════════════════════════════╝"] },
      explain: { response: ["📖 BASE64","━━━━━━━━━","Convertit binaire → texte ASCII.","","⚠ CE N'EST PAS DU CHIFFREMENT !","→ Pas de clé. Tout le monde peut décoder.","→ Utiliser bcrypt/Argon2 pour le hachage."] },
    },
    defaultResponse: (input) => {
      if (input.startsWith("decode ")) { try { const decoded = atob(input.slice(7).trim()); if (decoded === secret) return null; return ["→ Décodé : " + decoded]; } catch(e) { return ["✗ Base64 invalide."]; } }
      if (input.startsWith("encode ")) return ["→ Encodé : " + btoa(input.slice(7).trim())];
      return null;
    },
    checkWin: (input) => { if (!input.startsWith("decode ")) return false; try { return atob(input.slice(7).trim()) === secret; } catch(e) { return false; } },
    winResponse: ["✓ DÉCODÉ : " + secret, "", "⚠ LEÇON :", "→ Base64 = réversible sans clé.", "→ Ne JAMAIS l'utiliser pour protéger des données."],
  };
};

const generateSQLiLevel = (difficulty) => {
  const sc = L.sqli.scenarios[difficulty] || L.sqli.scenarios["intermédiaire"];
  return {
    id: "sqli", title: "INJECTION SQL",
    mission: "Formulaire de login (table: " + sc.table + "). Exploitez avec 'login <user> <pass>'.",
    hint: sc.hint, topic: "Injection SQL (OWASP #1)",
    commands: {
      help: { response: ["╔══════════════════════════════════════════════╗","║  login <user> <pass> - Tenter une connexion   ║","║  view query          - Voir la requête SQL    ║","║  explain             - Comprendre SQLi        ║","╚══════════════════════════════════════════════╝"] },
      "view query": { response: ["📋 Requête :", "", "  " + sc.query, "", "→ Que se passe-t-il si vous injectez une quote ?"] },
      explain: { response: ["📖 INJECTION SQL","━━━━━━━━━━━━━━━━","Techniques :","  • admin' -- (commentaire)","  • ' OR '1'='1 (toujours vrai)","  • UNION SELECT","","Défense : prepared statements, ORM, WAF."] },
    },
    defaultResponse: (input) => {
      if (input.startsWith("login ")) { const p = input.slice(6); if (p.includes("' --") || p.includes("'--") || p.toLowerCase().includes("' or '1'='1") || p.toLowerCase().includes("' or 1=1") || p.toLowerCase().includes("union select")) return null; return ["✗ Identifiants incorrects."]; }
      return null;
    },
    checkWin: (input) => { if (!input.startsWith("login ")) return false; const p = input.slice(6).toLowerCase(); return p.includes("' --") || p.includes("'--") || p.includes("' or '1'='1") || p.includes("' or 1=1") || p.includes("union select"); },
    winResponse: ["✓ INJECTION RÉUSSIE ! Connecté admin.", "", "⚠ LEÇON :", "→ TOUJOURS utiliser des prepared statements.", "→ Ne jamais concaténer des entrées dans du SQL."],
  };
};

const generatePhishingLevel = (difficulty) => {
  const emails = L.phishing.emailSets[difficulty];
  const phishIndex = emails.findIndex((e) => !e.legit);
  return {
    id: "phishing", title: "DÉTECTION PHISHING",
    mission: emails.length + " emails interceptés. Tapez 'read <n>' puis 'report <n>'.",
    hint: "Le phishing est l'email #" + (phishIndex + 1), topic: "Phishing & Ingénierie sociale",
    commands: {
      help: { response: ["╔══════════════════════════════════════════════╗","║  read <1-3>      - Lire un email             ║","║  report <1-3>    - Signaler comme phishing   ║","║  analyze <1-3>   - Analyser les headers      ║","╚══════════════════════════════════════════════╝"] },
      explain: { response: ["📖 PHISHING","━━━━━━━━━━━","🔴 Signaux : domaine suspect, URL louche, urgence","🟢 Vérifier : survoler liens, checker domaine"] },
    },
    defaultResponse: (input) => {
      const match = input.match(/^(read|report|analyze) (\d)$/);
      if (!match) return null;
      const action = match[1]; const idx = parseInt(match[2]) - 1;
      if (idx < 0 || idx >= emails.length) return ["✗ Email inexistant."];
      const email = emails[idx];
      if (action === "read") return ["═══════════════════════════════","📧 EMAIL #" + (idx+1),"De: " + email.from,"Objet: " + email.subject,"───────────────────────────────",...email.body.split("\n"),"═══════════════════════════════"];
      if (action === "analyze") { const domain = email.from.split("@")[1]; return ["🔍 Headers #" + (idx+1) + " :","  From: " + email.from,"  SPF: " + (email.legit ? "PASS" : "SOFTFAIL"),"  DKIM: " + (email.legit ? "PASS" : "NONE"), !email.legit ? "  ⚠ Authentification échouée !" : ""]; }
      if (action === "report") { if (!email.legit) return null; return ["✗ Email légitime. Cherchez mieux !"]; }
      return null;
    },
    checkWin: (input) => { const match = input.match(/^report (\d)$/); if (!match) return false; return parseInt(match[1]) - 1 === phishIndex; },
    winResponse: ["✓ CORRECT ! Phishing identifié !", "", "🔍 Indices :", ...emails[phishIndex].indices.map((i) => "  • " + i), "", "⚠ 91% des cyberattaques commencent par du phishing."],
  };
};

const generateHashLevel = () => {
  const chosen = pick(L.hash.list);
  return {
    id: "hash", title: "RAINBOW TABLES",
    mission: "Hash MD5 : '" + chosen.md5 + "'. Tapez 'rainbow <hash>' ou 'crack <hash>'.",
    hint: "Tapez: rainbow " + chosen.md5, topic: "Hachage & Rainbow Tables",
    commands: {
      help: { response: ["╔══════════════════════════════════════════════╗","║  rainbow <hash>  - Rainbow table              ║","║  crack <hash>    - Dictionnaire               ║","║  hash <texte>    - Calculer le hash           ║","╚══════════════════════════════════════════════╝"] },
      explain: { response: ["📖 HACHAGE","━━━━━━━━━━","MD5: 128 bits (CASSÉ)","SHA-256: 256 bits (sûr)","bcrypt: RECOMMANDÉ","","Rainbow table = hash pré-calculés.","Défense : sel (salt) unique."] },
    },
    defaultResponse: (input) => {
      if (input.startsWith("rainbow ") || input.startsWith("crack ")) { const h = input.split(" ").slice(1).join(" ").trim(); if (h === chosen.md5) return null; return ["✗ Hash non trouvé."]; }
      if (input.startsWith("hash ")) { const text = input.slice(5).trim(); if (text === chosen.plain) return ["→ MD5(" + text + ") = " + chosen.md5, "C'est le même hash !"]; return ["→ MD5(" + text + ") = " + Array.from({length:32},()=>"0123456789abcdef"[randInt(0,15)]).join("")]; }
      return null;
    },
    checkWin: (input) => { if (!input.startsWith("rainbow ") && !input.startsWith("crack ")) return false; return input.split(" ").slice(1).join(" ").trim() === chosen.md5; },
    winResponse: ["⟳ Rainbow table...","  " + chosen.md5 + " → \"" + chosen.plain + "\"","","✓ PASSWORD : " + chosen.plain,"","⚠ MD5/SHA-1 CASSÉS. Utiliser bcrypt/Argon2."],
  };
};

const PROFILES = {
  "débutant": { label: "🟢 DÉBUTANT", desc: "Lycéen / Curieux", color: "#0f0", levels: () => [buildLevel(L.scan), generateBruteForceLevel("débutant"), generateCaesarLevel("débutant"), generateBase64Level("débutant"), generatePhishingLevel("débutant")] },
  "intermédiaire": { label: "🟡 INTERMÉDIAIRE", desc: "Étudiant IT / Bac+2", color: "#ff0", levels: () => [buildLevel(L.scan), generateBruteForceLevel("intermédiaire"), generateCaesarLevel("intermédiaire"), generateBase64Level("intermédiaire"), generateSQLiLevel("intermédiaire"), buildLevel(L.osint), generatePhishingLevel("intermédiaire")] },
  "expert": { label: "🔴 EXPERT", desc: "M1/M2 Cyber", color: "#f44", levels: () => [buildLevel(L.scan), generateBruteForceLevel("expert"), generateCaesarLevel("expert"), generateBase64Level("expert"), generateHashLevel(), generateSQLiLevel("expert"), buildLevel(L.osint), buildLevel(L.network), generatePhishingLevel("expert")] },
};

var root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(GameEngine, {
  title: "CYBER TERMINAL",
  icon: "⬡",
  profiles: PROFILES,
  rainConfig: { chars: "01アイウエオカキクケコサシスセソ", colors: ["#0f0"], fontSize: 14, speed: 50, opacity: 0.12, fadeAlpha: 0.05 },
  backgroundColor: "#0a0a0a",
  headerBg: "#111",
  headerBorder: "#1a1a1a",
  themeColor: "#0f0",
  terminalColors: { system: "#0a0", input: "#fff", success: "#0f0", error: "#f44", hint: "#ff0", mission: "#6af", response: "#aaa" },
  promptSymbol: "❯❯",
  inputPlaceholder: "Tapez une commande...",
  subtitleText: "HACKING ÉTHIQUE — V2",
  victoryTitle: "MISSION ACCOMPLIE",
  baseScores: { "débutant": 500, "intermédiaire": 750, "expert": 1000 },
  preprocessInput: function (original, trimmed) {
    return (trimmed.startsWith("decode ") || trimmed.startsWith("caesar ") || trimmed.startsWith("login ") || trimmed.startsWith("try "))
      ? original.replace(/^\S+/, function (m) { return m.toLowerCase(); })
      : trimmed;
  },
  getInputPrefix: function (original) { return "❯❯ " + original; },
  getUnknownMsg: function () { return "Commande non reconnue. Tapez 'help'."; },
  topicIcon: "📡"
}));

    </script>
</body>
</html>
