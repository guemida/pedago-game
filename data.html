const buildLevels = () => {
  // Level 0 — Types de données
  const typeQuestions = shuffle([
    {
      data: '["Alice", 28, "Paris", true]',
      q: "Quel type de structure est-ce ?",
      a: ["list", "liste", "array", "tableau"],
      explain: "Une liste (ou array) est une collection ordonnée d'éléments de types variés.",

    {
      data: '{"nom": "Alice", "age": 28, "ville": "Paris"}',
      q: "Quel type de structure est-ce ?",

      explain: "Un dictionnaire (dict) stocke des paires clé-valeur. Format JSON = standard d'échange de données.",
    },
    {
      data: "nom,age,ville\nAlice,28,Paris\nBob,35,Lyon",

    },
    {
      table: "TABLE produits (id, nom, prix, stock, categorie)\n  1 | Laptop  | 999 | 15 | Tech\n  2 | Clavier |  49 | 82 | Tech\n  3 | Cahier  |   5 | 200| Bureau\n  4 | Écran   | 350 |  7 | Tech",

      explain: "Le nettoyage de données = 80% du travail d'un data scientist. Il faut détecter : valeurs manquantes (NaN/null), outliers, données invalides, doublons.",

      problems: [
        "bob@mail — email invalide (pas de domaine)",
        "Formats de date incohérents (YYYY-MM-DD vs DD/MM/YYYY)",
        "Doublon : alice@mail.com apparaît 2 fois",
        "Pays incohérent : France, france, FR (normalisation)",
        "Date invalide : mois 13 n'existe pas",
        "NULL = valeur manquante",
      ],
      explain: "Qualité des données : cohérence des formats, doublons, validation (emails, dates), normalisation des catégories.",
    },
  ]);
  const cq = cleanQuestions[0];

  // Level 3 — Statistiques descriptives
  const statQuestions = shuffle([
    {
      data: "Revenus mensuels (€) : 2100, 2300, 2200, 2400, 2100, 8500, 2300",

    a: ["overfitting", "sur-apprentissage", "surapprentissage", "overfit"],
    explain: "OVERFITTING = le modèle a mémorisé les données d'entraînement au lieu d'apprendre les patterns. Solution : toujours séparer train/test (typiquement 80/20), utiliser la validation croisée.",

      a: ["61", "61%", "62", "62%"],

    },
    {
      scenario: "Diagnostic médical (cancer) :\n  - 200 patients testés\n  - 180 prédits sains → 175 vrais, 5 avaient un cancer\n  - 20 prédits malades → 15 vrais cancers, 5 faux positifs",
      q: "La précision pour la classe 'cancer' est de combien ? (en %)",
      a: ["75", "75%"],

  ]);
  const feq = feQuestions[0];

  const algoQuestions = shuffle([
    {
      scenario: "Vous devez classer des emails en spam/pas spam.\nVous avez 50 000 emails labellisés.\nLes features sont : nb_mots, nb_liens, contient_mot('gratuit'), heure_envoi, etc.",

  // Level 10 — Deep Learning
  const dlQuestions = shuffle([

      a: ["probabilite", "probabilites", "probabilité", "probabilités", "proba", "distribution"],

    {
      scenario: "Vous entraînez un CNN sur ImageNet (1.2M images, 1000 classes).\nÉpoque 1: loss=4.2, accuracy=8%\nÉpoque 50: train_loss=0.3, train_acc=95%, val_loss=2.1, val_acc=62%",

  ]);
  const dlq = dlQuestions[0];

  // Level 11 — Pipeline & MLOps
  const mlopsQuestions = shuffle([
    {
      scenario: "Votre modèle de recommandation est en production depuis 6 mois.\nPerformance initiale : precision@10 = 0.42\nPerformance actuelle : precision@10 = 0.28\nAucune modification du code.",

      a: ["data drift", "drift", "concept drift", "model drift", "distribution shift", "derive", "dérive"],

    // Level 0

    },
    // Level 1
    {

    // Level 2
    {

      topic: "Data Cleaning", answers: cq.a,
      winResponse: ["✓ BON OEIL !", "", "Problèmes détectés :", ...cq.problems.map((p) => `  ⚠ ${p}`), "", `📖 ${cq.explain}`],

    // Level 3
    {
      id: 3, title: "STATISTIQUES DESCRIPTIVES",
      mission: `${stq.data}\n\n${stq.q}`,

      topic: "Statistiques", answers: stq.a,
      winResponse: ["✓ EXACT !", "", `📖 ${stq.explain}`],
      explain: ["📖 STATS DESCRIPTIVES", "━━━━━━━━━━━━━━━━━━━━━", "Tendance centrale : moyenne, médiane, mode", "Dispersion : écart-type, variance, IQR", "Distribution : histogramme, boxplot", "", "Médiane > Moyenne quand outliers présents", "IQR = Q3 - Q1, outliers si < Q1-1.5*IQR ou > Q3+1.5*IQR"],

    },
    // Level 5
    {
      id: 5, title: "TRAIN / TEST SPLIT",
      mission: `${splitQuestion.scenario}\n\n${splitQuestion.q}`,
      hint: "Quand un modèle performe bien en entraînement mais mal en réalité...",
      topic: "Overfitting", answers: splitQuestion.a,
      winResponse: ["✓ EXACTEMENT !", "", `📖 ${splitQuestion.explain}`, "", "Règle d'or : JAMAIS évaluer sur les données d'entraînement."],
      explain: ["📖 OVERFITTING vs UNDERFITTING", "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", "Overfitting : trop appris → mémorise le bruit", "  → train_acc >> val_acc", "Underfitting : pas assez appris → trop simple", "  → train_acc ET val_acc faibles", "", "Solutions overfitting :", "  • Train/test split (80/20)", "  • Cross-validation (k-fold)", "  • Régularisation (L1, L2, Dropout)", "  • Plus de données / data augmentation"],
    },
    // Level 6
    {
      id: 6, title: "MÉTRIQUES ML",
      mission: `${mq.scenario}\n\n${mq.q}`,
      hint: "Recall = TP / (TP + FN). Précision = TP / (TP + FP).",
      topic: "Métriques", answers: mq.a,
      winResponse: ["✓ BIEN CALCULÉ !", "", `📖 ${mq.explain}`],
      explain: ["📖 MÉTRIQUES DE CLASSIFICATION", "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", "Accuracy = (TP+TN) / Total", "Précision = TP / (TP+FP) → 'Parmi mes prédictions +, combien sont vraies ?'", "Recall = TP / (TP+FN) → 'Parmi les vrais +, combien j'ai trouvé ?'", "F1-Score = 2 × (P×R)/(P+R)", "", "⚠ Accuracy trompeuse si classes déséquilibrées !", "Fraude/Médical → prioriser Recall", "Spam → prioriser Précision"],

    // Level 7

    // Level 10

      topic: "Deep Learning", answers: dlq.a,
      winResponse: ["✓ EXACT !", "", `📖 ${dlq.explain}`],
      explain: ["📖 DEEP LEARNING", "━━━━━━━━━━━━━━━━━", "Architectures principales :", "  • MLP : couches denses, données tabulaires", "  • CNN : images, détection de patterns spatiaux", "  • RNN/LSTM : séquences, texte, séries temporelles", "  • Transformer : NLP (BERT, GPT), vision (ViT)", "", "Fonctions d'activation :", "  ReLU → couches cachées (résout vanishing gradient)", "  Softmax → sortie classification multi-classes", "  Sigmoid → sortie classification binaire"],
    },
    // Level 11
    {
      id: 11, title: "MLOPS & PRODUCTION",
      mission: `${mlq.scenario}\n\n${mlq.q}`,
      hint: "Le monde réel change. Les données aussi.",
      topic: "MLOps", answers: mlq.a,
      winResponse: ["✓ BIEN VU !", "", `📖 ${mlq.explain}`, "", "→ Un modèle en production sans monitoring = une bombe à retardement."],
      explain: ["📖 MLOPS", "━━━━━━━━━", "Pipeline complet :", "  Data → Feature Store → Train → Evaluate → Deploy → Monitor", "", "Concepts clés :", "  • Data drift : distribution des données change", "  • Concept drift : la relation X→Y change", "  • A/B testing : comparer modèles en prod", "  • Feature store : centraliser les features", "  • Model registry : versioner les modèles", "", "Outils : MLflow, Kubeflow, Airflow, DVC, Weights & Biases"],
    },
  ];
};

// ═══════════════════════════════════════════
// MAIN COMPONENT
// ═══════════════════════════════════════════

function DataAIGame() {
  const [screen, setScreen] = useState("title");
  const [profile, setProfile] = useState(null);
  const [pseudo, setPseudo] = useState("");
  const [pseudoInput, setPseudoInput] = useState("");
  const [levels, setLevels] = useState([]);
  const [currentLevel, setCurrentLevel] = useState(0);
  const [lines, setLines] = useState([]);
  const [input, setInput] = useState("");
  const [score, setScore] = useState(0);
  const [startTime, setStartTime] = useState(null);
  const [hintsUsed, setHintsUsed] = useState(0);
  const [levelSolved, setLevelSolved] = useState(false);
  const [commandHistory, setCommandHistory] = useState([]);
  const [historyIndex, setHistoryIndex] = useState(-1);

  const termRef = useRef(null);
  const inputRef = useRef(null);
  // FIX #1: useRef to track score for closures (setTimeout, goNextLevel)
  const scoreRef = useRef(0);
  // FIX #2: ref to cancel auto-advance timer and prevent double-advance
  const autoAdvanceTimer = useRef(null);
  // FIX #3: ref to track if we already advanced (prevents double goNextLevel)
  const hasAdvanced = useRef(false);

  // Keep scoreRef in sync
  useEffect(() => {
    scoreRef.current = score;
  }, [score]);

  const scrollToBottom = useCallback(() => {
    setTimeout(() => {
      if (termRef.current) {
        termRef.current.scrollTop = termRef.current.scrollHeight;
      }
    }, 20);
  }, []);

  const addLines = useCallback(
    (newLines) => {
      setLines((prev) => [...prev, ...newLines]);
      scrollToBottom();
    },
    [scrollToBottom]
  );

  const focusInput = () => {
    if (inputRef.current) inputRef.current.focus();
  };

  // Start game — regenerates levels each time (FIX for replay)
  const startGame = (prof) => {
    // Cancel any pending auto-advance from previous game
    if (autoAdvanceTimer.current) {
      clearTimeout(autoAdvanceTimer.current);
      autoAdvanceTimer.current = null;
    }
    hasAdvanced.current = false;

    const freshLevels = buildLevels();
    const profileLevels = PROFILES[prof].levels.map((i) => freshLevels[i]);
    setProfile(prof);
    setLevels(profileLevels);
    setCurrentLevel(0);
    setScore(0);
    scoreRef.current = 0;
    setHintsUsed(0);
    setStartTime(Date.now());
    setLevelSolved(false);
    setCommandHistory([]);
    setHistoryIndex(-1);

    const lvl = profileLevels[0];
    setLines([
      `┌──────────────────────────────────────────────────────┐`,
      `│  DATA/IA TERMINAL — ${PROFILES[prof].label.padEnd(30)}│`,
      `│  Agent : ${pseudo.padEnd(42)}│`,
      `│  Niveaux : ${String(profileLevels.length).padEnd(40)}│`,
      `└──────────────────────────────────────────────────────┘`,
      "",
      `═══ NIVEAU 1/${profileLevels.length} : ${lvl.title} ═══`,
      `📡 Thème : ${lvl.topic}`,
      "",
      ...lvl.mission.split("\n"),
      "",
      "Tapez votre réponse. Commandes : help | hint | explain | mission | skip",
    ]);
    setScreen("game");
    setTimeout(focusInput, 100);
  };

  // Process command
  const processCommand = (cmd) => {
    const trimmed = cmd.trim();
    if (!trimmed) return;

    setCommandHistory((prev) => [...prev, trimmed]);
    setHistoryIndex(-1);

    const lower = trimmed.toLowerCase();
    const lvl = levels[currentLevel];

    const promptLine = `data[${currentLevel + 1}]> ${trimmed}`;

    if (lower === "help") {
      addLines([
        promptLine, "",
        "╔═══════════════════════════════════════════╗",
        "║           COMMANDES DISPONIBLES           ║",
        "╠═══════════════════════════════════════════╣",
        "║  help      - Cette aide                  ║",
        "║  hint      - Obtenir un indice (-50 pts) ║",
        "║  explain   - Mini-cours sur le thème     ║",
        "║  mission   - Revoir l'énoncé             ║",
        "║  skip      - Passer au niveau suivant    ║",
        "║  score     - Score actuel                ║",
        "║  clear     - Nettoyer le terminal        ║",
        "╚═══════════════════════════════════════════╝",
      ]);
      return;
    }

    if (lower === "clear") {
      setLines([
        `═══ NIVEAU ${currentLevel + 1}/${levels.length} : ${lvl.title} ═══`,
        `Tapez 'mission' pour revoir l'énoncé.`,
      ]);
      return;
    }

    if (lower === "hint") {
      setHintsUsed((h) => h + 1);
      setScore((s) => {
        const newS = Math.max(0, s - 50);
        scoreRef.current = newS;
        return newS;
      });
      addLines([promptLine, "", `💡 INDICE : ${lvl.hint}`, "(-50 points)"]);
      return;
    }

    if (lower === "explain") {
      addLines([promptLine, "", ...lvl.explain]);
      return;
    }

    if (lower === "mission") {
      addLines([promptLine, "", `═══ ${lvl.title} ═══`, ...lvl.mission.split("\n")]);
      return;
    }

    if (lower === "score") {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mins = Math.floor(elapsed / 60);
      const secs = elapsed % 60;
      addLines([
        promptLine, "",
        `📊 Score : ${score} pts`,
        `⏱️ Temps : ${mins}m ${secs}s`,
        `💡 Hints utilisés : ${hintsUsed}`,
        `📈 Niveau : ${currentLevel + 1}/${levels.length}`,
      ]);
      return;
    }

    if (lower === "skip") {
      // Cancel any pending auto-advance
      if (autoAdvanceTimer.current) {
        clearTimeout(autoAdvanceTimer.current);
        autoAdvanceTimer.current = null;
      }
      addLines([promptLine, "", "⏭️ Niveau passé (0 points)"]);
      hasAdvanced.current = false;
      goNextLevel();
      return;
    }

    // Already solved — just inform
    if (levelSolved) {
      addLines([promptLine, "✓ Déjà résolu ! Appuyez sur Entrée pour continuer."]);
      return;
    }

    // Check answer
    const isCorrect = lvl.answers.some(
      (a) => lower === a.toLowerCase() || lower.includes(a.toLowerCase())
    );

    if (isCorrect) {
      const pts = 100;
      setScore((s) => {
        const newS = s + pts;
        scoreRef.current = newS;
        return newS;
      });
      setLevelSolved(true);
      hasAdvanced.current = false; // reset for this level transition

      addLines([
        promptLine, "",
        ...lvl.winResponse, "",
        `  +${pts} points !`, "",
        currentLevel < levels.length - 1
          ? "→ Appuyez sur Entrée pour continuer... (auto dans 4s)"
          : "→ Appuyez sur Entrée pour voir vos résultats !",
      ]);

      // Auto-advance after 4s (only if not last level)
      if (currentLevel < levels.length - 1) {
        autoAdvanceTimer.current = setTimeout(() => {
          if (!hasAdvanced.current) {
            hasAdvanced.current = true;
            goNextLevel();
          }
          autoAdvanceTimer.current = null;
        }, 4000);
      }
    } else {
      addLines([
        promptLine, "",
        "✗ Incorrect. Réessayez !",
        "  (tapez 'hint' pour un indice ou 'explain' pour un cours)",
      ]);
    }
  };

  const goNextLevel = () => {
    const next = currentLevel + 1;
    if (next >= levels.length) {
      // WIN — use scoreRef for accurate score
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mins = Math.floor(elapsed / 60);
      const secs = elapsed % 60;
      
      const currentScore = scoreRef.current;
      const rawBonus = Math.max(0, 500 - elapsed);
      const bonus = currentScore > 0 ? Math.min(rawBonus, Math.floor(currentScore * 0.5)) : 0;
      const finalScore = currentScore + bonus;

      setScore(finalScore);
      scoreRef.current = finalScore;

      addLines([
        "",
        "╔══════════════════════════════════════════════════╗",
        "║            🏆 MISSION TERMINÉE !                ║",
        "╠══════════════════════════════════════════════════╣",
        `║  Agent : ${pseudo.padEnd(38)}║`,
        `║  Profil : ${PROFILES[profile].label.padEnd(36)}║`,
        `║  Score : ${String(finalScore + " pts").padEnd(38)}║`,
        `║  Bonus temps : ${String("+" + bonus + " pts").padEnd(32)}║`,
        `║  Temps : ${(mins + "m " + String(secs).padStart(2, "0") + "s").padEnd(38)}║`,
        `║  Hints : ${String(hintsUsed).padEnd(38)}║`,
        "╚══════════════════════════════════════════════════╝",
        "",
        finalScore > 800
          ? "🌟 EXCEPTIONNEL ! Tu es prêt pour le terrain."
          : finalScore > 500
          ? "👏 Solide ! Continue à t'entraîner."
          : "📚 Pas mal ! Revois les concepts avec 'explain'.",
        "",
        "Tapez 'restart' pour rejouer ou 'menu' pour changer de profil.",
      ]);
      setScreen("win");
      return;
    }

    setCurrentLevel(next);
    setLevelSolved(false);
    hasAdvanced.current = false;
    const lvl = levels[next];
    addLines([
      "",
      "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
      "",
      `═══ NIVEAU ${next + 1}/${levels.length} : ${lvl.title} ═══`,
      `📡 Thème : ${lvl.topic}`,
      "",
      ...lvl.mission.split("\n"),
      "",
      "Tapez votre réponse. Commandes : help | hint | explain",
    ]);
  };

  const handleKey = (e) => {
    if (e.key === "Enter") {
      const cmd = input;
      setInput("");

      // WIN screen commands
      if (screen === "win") {
        const lower = cmd.toLowerCase().trim();
        if (lower === "restart") {
          startGame(profile);
          return;
        }
        if (lower === "menu") {
          // FIX: properly reset lines when going back to menu
          setLines([]);
          setScreen("profile");
          return;
        }
        // FIX: feedback for unknown commands on win screen
        addLines([
          `> ${cmd}`,
          "❓ Commandes : 'restart' pour rejouer | 'menu' pour changer de profil",
        ]);
        return;
      }

      // Level solved → advance (cancel auto-advance timer)
      if (levelSolved) {
        if (autoAdvanceTimer.current) {
          clearTimeout(autoAdvanceTimer.current);
          autoAdvanceTimer.current = null;
        }
        if (!hasAdvanced.current) {
          hasAdvanced.current = true;
          goNextLevel();
        }
        return;
      }

      processCommand(cmd);
    }

    if (e.key === "ArrowUp") {
      e.preventDefault();
      if (commandHistory.length > 0) {
        const newIdx = historyIndex === -1
          ? commandHistory.length - 1
          : Math.max(0, historyIndex - 1);
        setHistoryIndex(newIdx);
        setInput(commandHistory[newIdx]);
      }
    }
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (historyIndex === -1) return;
      const newIdx = historyIndex + 1;
      if (newIdx >= commandHistory.length) {
        setHistoryIndex(-1);
        setInput("");
      } else {
        setHistoryIndex(newIdx);
        setInput(commandHistory[newIdx]);
      }
    }
  };

  // ═══════════════════════════════════════════
  // TITLE SCREEN
  // ═══════════════════════════════════════════
  if (screen === "title") {
    return (
      <div
        style={{
          minHeight: "100vh",
          background: "linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0d1b2a 100%)",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: "'JetBrains Mono', 'Fira Code', 'Courier New', monospace",
          padding: "20px",
        }}
      >
        <div style={{ maxWidth: 600, width: "100%", textAlign: "center" }}>
          <div style={{ fontSize: "11px", color: "#6366f1", letterSpacing: "6px", marginBottom: 12, textTransform: "uppercase" }}>
            Terminal Éducatif
          </div>
          <h1 style={{
            fontSize: "clamp(32px, 6vw, 56px)", fontWeight: 900, margin: "0 0 8px 0",
            background: "linear-gradient(135deg, #818cf8, #c084fc, #f472b6)",
            WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", lineHeight: 1.1,
          }}>
            DATA / IA
          </h1>
          <div style={{ fontSize: 13, color: "#64748b", marginBottom: 40, letterSpacing: "2px" }}>
            CHALLENGE
          </div>
          <div style={{
            background: "rgba(99, 102, 241, 0.08)", border: "1px solid rgba(99, 102, 241, 0.2)",
            borderRadius: 12, padding: "24px", marginBottom: 30, textAlign: "left",
          }}>
            <div style={{ color: "#94a3b8", fontSize: 12, lineHeight: 1.8 }}>
              <span style={{ color: "#818cf8" }}>$</span> Maîtrisez les fondamentaux de la Data Science et de l'IA<br />
              <span style={{ color: "#818cf8" }}>$</span> SQL, nettoyage, stats, ML, deep learning, éthique<br />
              <span style={{ color: "#818cf8" }}>$</span> 3 profils : Débutant → Intermédiaire → Expert<br />
              <span style={{ color: "#818cf8" }}>$</span> Questions aléatoires à chaque partie
            </div>
          </div>
          <div style={{ marginBottom: 16 }}>
            <input
              type="text" placeholder="Entrez votre pseudo..."
              value={pseudoInput} onChange={(e) => setPseudoInput(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && pseudoInput.trim()) {
                  setPseudo(pseudoInput.trim());
                  setScreen("profile");
                }
              }}
              style={{
                width: "100%", maxWidth: 320, padding: "12px 16px",
                background: "rgba(15, 15, 35, 0.8)", border: "1px solid rgba(99, 102, 241, 0.3)",
                borderRadius: 8, color: "#e2e8f0", fontSize: 14, fontFamily: "inherit",
                outline: "none", textAlign: "center", boxSizing: "border-box",
              }}
            />
          </div>
          <button
            onClick={() => { if (pseudoInput.trim()) { setPseudo(pseudoInput.trim()); setScreen("profile"); } }}
            disabled={!pseudoInput.trim()}
            style={{
              padding: "12px 40px",
              background: pseudoInput.trim() ? "linear-gradient(135deg, #6366f1, #8b5cf6)" : "rgba(99,102,241,0.2)",
              border: "none", borderRadius: 8,
              color: pseudoInput.trim() ? "#fff" : "#64748b",
              fontSize: 14, fontFamily: "inherit",
              cursor: pseudoInput.trim() ? "pointer" : "default",
              fontWeight: 600, letterSpacing: "1px", transition: "all 0.2s",
            }}
          >
            DÉMARRER →
          </button>
          <div style={{ marginTop: 40, fontSize: 10, color: "#334155", letterSpacing: "1px" }}>
            v1.1 — DATA/IA CHALLENGE TERMINAL
          </div>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════
  // PROFILE SELECT
  // ═══════════════════════════════════════════
  if (screen === "profile") {
    return (
      <div
        style={{
          minHeight: "100vh",
          background: "linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0d1b2a 100%)",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: "'JetBrains Mono', 'Fira Code', 'Courier New', monospace",
          padding: "20px",
        }}
      >
        <div style={{ maxWidth: 650, width: "100%" }}>
          <div style={{ textAlign: "center", marginBottom: 36 }}>
            <div style={{ fontSize: 11, color: "#6366f1", letterSpacing: 4, marginBottom: 8 }}>
              AGENT : {pseudo}
            </div>
            <h2 style={{ fontSize: 28, fontWeight: 800, color: "#e2e8f0", margin: 0 }}>
              Choisissez votre profil
            </h2>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {Object.entries(PROFILES).map(([key, p]) => {
              const topicsByLevel = {
                beginner: ["Structures de données", "SQL basics", "Data Cleaning", "Statistiques", "Visualisation", "Overfitting"],
                intermediate: ["...Débutant +", "Métriques ML", "Feature Engineering", "Types d'algorithmes"],
                expert: ["...Intermédiaire +", "Biais & Éthique IA", "Deep Learning", "MLOps & Production"],
              };
              return (
                <button
                  key={key} onClick={() => startGame(key)}
                  style={{
                    display: "flex", alignItems: "flex-start", gap: 20,
                    padding: "20px 24px", background: "rgba(15, 15, 35, 0.6)",
                    border: `1px solid ${p.color}33`, borderRadius: 12,
                    cursor: "pointer", textAlign: "left", transition: "all 0.2s",
                    fontFamily: "inherit",
                  }}
                  onMouseEnter={(e) => {
                    e.currentTarget.style.background = `${p.color}15`;
                    e.currentTarget.style.borderColor = `${p.color}66`;
                    e.currentTarget.style.transform = "translateX(4px)";
                  }}
                  onMouseLeave={(e) => {
                    e.currentTarget.style.background = "rgba(15, 15, 35, 0.6)";
                    e.currentTarget.style.borderColor = `${p.color}33`;
                    e.currentTarget.style.transform = "translateX(0)";
                  }}
                >
                  <div style={{
                    minWidth: 50, height: 50, borderRadius: 10, background: `${p.color}20`,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 22, flexShrink: 0,
                  }}>
                    {p.label.split(" ")[0]}
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ color: p.color, fontWeight: 700, fontSize: 15, marginBottom: 2 }}>
                      {p.label.split(" ").slice(1).join(" ")} — {p.desc}
                    </div>
                    <div style={{ color: "#64748b", fontSize: 11, marginBottom: 8 }}>
                      {p.levels.length} niveaux
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                      {topicsByLevel[key].map((t, i) => (
                        <span key={i} style={{
                          fontSize: 10, padding: "2px 8px", borderRadius: 4,
                          background: `${p.color}15`, color: `${p.color}cc`,
                          border: `1px solid ${p.color}22`,
                        }}>{t}</span>
                      ))}
                    </div>
                  </div>
                  <div style={{ color: "#475569", fontSize: 18, alignSelf: "center" }}>→</div>
                </button>
              );
            })}
          </div>
          <div style={{ textAlign: "center", marginTop: 24 }}>
            <button
              onClick={() => setScreen("title")}
              style={{ background: "none", border: "none", color: "#475569", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}
            >
              ← Retour
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════
  // GAME SCREEN
  // ═══════════════════════════════════════════
  const lvl = levels[currentLevel];
  const prof = PROFILES[profile];

  return (
    <div
      style={{
        height: "100vh", display: "flex", flexDirection: "column",
        background: "#080818",
        fontFamily: "'JetBrains Mono', 'Fira Code', 'Courier New', monospace",
        overflow: "hidden",
      }}
      onClick={focusInput}
    >
      {/* Header bar */}
      <div style={{
        display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "8px 16px", background: "rgba(99, 102, 241, 0.08)",
        borderBottom: "1px solid rgba(99, 102, 241, 0.15)",
        flexShrink: 0, flexWrap: "wrap", gap: 8,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ fontSize: 11, color: prof.color, fontWeight: 700 }}>{prof.label}</span>
          <span style={{ color: "#475569", fontSize: 11 }}>│</span>
          <span style={{ color: "#94a3b8", fontSize: 11 }}>{pseudo}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <span style={{ color: "#818cf8", fontSize: 11 }}>📊 {score} pts</span>
          <span style={{ color: "#64748b", fontSize: 11 }}>📡 {currentLevel + 1}/{levels.length}</span>
          <span style={{ color: "#64748b", fontSize: 11 }}>{lvl && `[${lvl.topic}]`}</span>
        </div>
      </div>

      {/* Terminal */}
      <div ref={termRef} style={{ flex: 1, overflowY: "auto", padding: "16px", paddingBottom: 80 }}>
        {lines.map((line, i) => (
          <div key={i} style={{
            fontSize: 12, lineHeight: 1.7,
            color: line.startsWith("✓") ? "#22c55e"
              : line.startsWith("✗") ? "#ef4444"
              : line.startsWith("═══") ? "#818cf8"
              : line.startsWith("📖") ? "#c084fc"
              : line.startsWith("💡") ? "#f59e0b"
              : line.startsWith("  ⚠") ? "#f97316"
              : line.startsWith("→") ? "#6366f1"
              : line.startsWith("❓") ? "#f59e0b"
              : line.startsWith("data[") ? "#38bdf8"
              : line.includes("╔") || line.includes("║") || line.includes("╚") || line.includes("╠") ? "#6366f1"
              : line.startsWith("━") ? "#334155"
              : "#94a3b8",
            whiteSpace: "pre-wrap", wordBreak: "break-word", fontFamily: "inherit",
          }}>
            {line || "\u00A0"}
          </div>
        ))}
      </div>

      {/* Input */}
      <div style={{
        position: "sticky", bottom: 0, display: "flex", alignItems: "center",
        padding: "12px 16px", background: "rgba(10, 10, 26, 0.95)",
        borderTop: "1px solid rgba(99, 102, 241, 0.15)",
        backdropFilter: "blur(8px)", flexShrink: 0,
      }}>
        <span style={{ color: "#818cf8", fontSize: 12, marginRight: 8, flexShrink: 0 }}>
          {screen === "win" ? ">" : `data[${currentLevel + 1}]>`}
        </span>
        <input
          ref={inputRef} type="text" value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={handleKey} autoFocus spellCheck={false}
          autoComplete="off" autoCapitalize="off"
          placeholder={screen === "win" ? "restart / menu" : ""}
          style={{
            flex: 1, background: "none", border: "none", color: "#e2e8f0",
            fontSize: 13, fontFamily: "inherit", outline: "none", caretColor: "#818cf8",
          }}
        />
      </div>
    </div>
  );
}

        /* --------------------------- */
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DataAIGame />); 
    </script>
</body>
