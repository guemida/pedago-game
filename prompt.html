<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Prompt Engineering — Challenge Terminal</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="shared/utils.js"></script>
    <script src="shared/rain.js"></script>
    <script src="shared/game-engine.js"></script>
    <script src="shared/level-builders.js"></script>
    <script src="data/prompt-levels.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>

var L = PROMPT_LEVELS;

var PROFILES = {
  "débutant": {
    label: "🟢 DÉBUTANT", desc: "Lycéen / Curieux IA", color: "#ec4899",
    levels: function () { return [buildLevel(L.role), buildLevel(L.clarity), buildLevel(L.fewshot), buildLevel(L.hallucination), buildLevel(L.format)]; },
  },
  "intermédiaire": {
    label: "🟡 INTERMÉDIAIRE", desc: "Étudiant IT / Bac+2", color: "#f59e0b",
    levels: function () { return [buildLevel(L.role), buildLevel(L.clarity), buildLevel(L.fewshot), buildLevel(L.cot), buildLevel(L.hallucination), buildLevel(L.format), buildLevel(L.injection)]; },
  },
  "expert": {
    label: "🔴 EXPERT", desc: "M1/M2 IA / Dev LLM", color: "#f87171",
    levels: function () { return [buildLevel(L.role), buildLevel(L.clarity), buildLevel(L.fewshot), buildLevel(L.cot), buildLevel(L.hallucination), buildLevel(L.format), buildLevel(L.temperature), buildLevel(L.injection), buildLevel(L.systemprompt), buildLevel(L.ethics), buildLevel(L.rag)]; },
  },
};

var root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(GameEngine, {
  title: "PROMPT TERMINAL",
  icon: "🤖",
  profiles: PROFILES,
  rainConfig: { chars: "🤖💡🧠✨📝🔮⚡prompt token context role system user assistant temperature embedding vector", colors: ["#ec4899", "#f472b6", "#a855f7", "#6366f1"], fontSize: 14, speed: 55, opacity: 0.12, fadeAlpha: 0.04 },
  backgroundColor: "#0a0a0f",
  headerBg: "#111118",
  headerBorder: "#222",
  themeColor: "#ec4899",
  terminalColors: { system: "#a855f7", input: "#ec4899", success: "#4ade80", error: "#f87171", hint: "#facc15", mission: "#e2e8f0", response: "#94a3b8" },
  promptSymbol: "🤖❯",
  inputPlaceholder: "Tapez une commande...",
  subtitleText: "MAÎTRISEZ L'ART DU PROMPT",
  victoryTitle: "PROMPT MASTER",
  baseScores: { "débutant": 500, "intermédiaire": 750, "expert": 1000 },
  preprocessInput: function (original, trimmed) {
    return trimmed.startsWith("answer ") ? "answer " + original.slice(7) : trimmed;
  },
  getInputPrefix: function (original) { return "🤖❯ " + original; },
  getUnknownMsg: function () { return "Commande non reconnue. Tapez 'help'."; },
  topicIcon: "🤖",
  lineStyles: {
    mission: { paddingLeft: "8px", borderLeft: "2px solid #ec489944" },
    system: { fontWeight: "bold" }
  }
}));

    </script>
</body>
</html>
